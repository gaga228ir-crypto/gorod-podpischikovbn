<!doctype html>
<html lang="ru">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Город подписчиков</title>

<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--bg:#070b24;--panel:rgba(12,8,36,.86);--gold:#ffd23f;--pink:#ff3d7f;--cyan:#5ef2ff;--text:#fff;--muted:#bdb6ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c.drag{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;padding:14px 16px 12px;background:linear-gradient(var(--panel),rgba(12,8,36,0));display:flex;flex-direction:column;gap:10px;z-index:2}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title h1{margin:0;font:800 18px/1.1 Unbounded,sans-serif;letter-spacing:.02em}
.count{font:500 12px Unbounded,sans-serif;color:var(--muted);white-space:nowrap}
.count b{color:var(--gold);font-weight:800;font-size:15px}
form.row{display:flex;gap:8px;max-width:520px}
input,textarea{width:100%;min-width:0;border:0;border-radius:999px;padding:12px 16px;font:600 16px Inter,sans-serif;background:#fff;color:#1a1238;outline:none}
textarea{border-radius:18px;resize:none;height:84px}
input:focus,textarea:focus{box-shadow:0 0 0 3px var(--pink)}
button,.btn{border:0;border-radius:999px;padding:12px 18px;font:800 13px Unbounded,sans-serif;cursor:pointer;background:var(--pink);color:#fff;text-decoration:none;white-space:nowrap;display:inline-block;text-align:center}
button:active,.btn:active{transform:scale(.96)}
button.ghost{background:rgba(255,255,255,.12)}
.msg{font:600 13px Inter,sans-serif;color:var(--gold);min-height:1em}
.card{position:fixed;left:50%;bottom:18px;transform:translate(-50%,160%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(160,150,255,.35);border-radius:22px;padding:16px 18px;width:min(92vw,420px);z-index:3;display:flex;align-items:center;gap:14px}

.card .sub{font:500 13px Inter,sans-serif;color:var(--muted);margin-top:4px}
.card .grow{flex:1;min-width:0}
.cta{position:fixed;right:16px;bottom:18px;z-index:2}
.card.show ~ .cta{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:7px 12px;font:800 11px Unbounded,sans-serif;cursor:pointer;background:var(--gold);color:#1a1238;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,63,.25)}}

.cand b{font:800 18px Unbounded,sans-serif;color:var(--gold);min-width:26px}

.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:999px}

.srow{display:flex;flex-direction:column;gap:6px}
.srow>span{font:600 12px Inter,sans-serif;color:var(--muted)}

.opt.on{border-color:var(--gold)}
.sw{width:34px;height:34px;padding:0;border-radius:50%}
.pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.hint{position:fixed;left:16px;bottom:24px;font:500 12px Inter,sans-serif;color:var(--muted);z-index:2;opacity:.8}
@media (max-width:520px){.hint{display:none}}

.sheet p b{color:#fff}

.step a{color:var(--gold)}
.code{font:800 40px Unbounded,sans-serif;color:var(--gold);text-align:center;letter-spacing:.04em;padding:14px;border:2px dashed var(--gold);border-radius:18px}
.err{color:#ff8fae;font:600 13px Inter,sans-serif;min-height:1em}
.btns{display:flex;gap:8px}.btns>*{flex:1}
</style>

<script>
/* ===================== НАСТРОЙКИ ===================== */
const TIKTOK_URL = 'https://www.tiktok.com/@eben51041';

const CUSTOM_PRICE = 10;
// Из Supabase → Project Settings → API. Пока пусто — город берёт ники из списка ниже.

const SUPABASE_ANON_KEY = '';
const FALLBACK = ['@твой_ник'];
const CHECK_TIME = 'каждый день около 17:00 по МСК';
// Ники, которые не показываем над домами (дом остаётся, подпись — «Житель №…»)

const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function rnd(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const norm = s => String(s).trim().replace(/^[~@]+/, '').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (path, opt = {}) => fetch(SUPABASE_URL + '/rest/v1/' + path, { ...opt, headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', ...(opt.headers || {}) } });

// ---------- планировка ----------
const isRoad = (x, y) => (((x % 3) + 3) % 3 === 0) || (((y % 3) + 3) % 3 === 0);
const cells = [];
for (let x = -80; x <= 80; x++) for (let y = -80; y <= 80; y++) if (!isRoad(x, y)) cells.push([x, y]);
cells.sort((a, b) => (Math.hypot(a[0] - 1.5, a[1] - 1.5) - Math.hypot(b[0] - 1.5, b[1] - 1.5)) || (a[0] - b[0]) || (a[1] - b[1]));

let houses = [], FREE = null, EMPTY = [], walkers = [];

  houses = list.map((r, i) => { const h = CityHouse.build(r.nick, r.recipe, cells[i], i); h.key = norm(r.nick); h.label = HIDE.test(h.key) && !/^user\d+$/.test(h.key) ? 'Житель №' + (i + 1) : r.nick; h.appear = T + 0.2 + Math.min(i, 60) * 0.04; return h; });
  FREE = cells[houses.length]; EMPTY = cells.slice(houses.length + 1, houses.length + 13);
  buildNature(houses.length + 13);
  document.getElementById('cnt').textContent = houses.length;
  walkers = []; const r = rnd(7), span = Math.ceil(Math.sqrt(houses.length + 20)) + 4;
  const SHIRT = ['#ff6b8a', '#ffd166', '#6ee7b7', '#7cc8ff', '#c084fc', '#ff9f68', '#f1f3f5', '#ff4d4d', '#20c997', '#4c6ef5'];
  const PANTS = ['#343a60', '#495057', '#1c3d6e', '#5c3d2e', '#2b2b2b', '#6c757d'];
  const SKIN = ['#f6d2b5', '#eac0a0', '#d9a47c', '#b07a52', '#8a5a3b'];
  const HAIR = ['#2b1d14', '#4a2f1b', '#8b5a2b', '#e0b14a', '#111111', '#c0392b', '#e8e8e8', '#ff7eb6', '#4dabf7'];
  const pick = a => a[(r() * a.length) | 0];
  for (let i = 0; i < Math.min(140, 8 + houses.length * 2); i++) {
    const alongX = r() < 0.5, line = Math.round((r() * 2 - 1) * span / 3) * 3 + (r() < .5 ? 0.38 : -0.38);
    const hv = r();
    walkers.push({ alongX, line, pos: (r() * 2 - 1) * span, dir: r() < .5 ? 1 : -1, sp: 0.45 + r() * 0.45, span, ph: r() * 6,
      col: pick(SHIRT), pants: pick(PANTS), skin: pick(SKIN), hair: pick(HAIR), style: hv < .3 ? 'cap' : hv < .55 ? 'long' : hv < .62 ? 'beanie' : 'short', capCol: pick(SHIRT), size: 1.35 + r() * .25,
      nick: houses.length ? houses[(r() * houses.length) | 0].label : '' });
  }
}
async function loadCity() {
  // Базовые жители — из subscribers.json (порядок = порядок заселения)
  let base = [];
  try { const r = await fetch('subscribers.json?v=' + Date.now()); if (r.ok) base = await r.json(); } catch (e) {}
  if (!Array.isArray(base) || !base.length) base = FALLBACK;
  const list = [], byKey = new Map();
  for (const n of base) { const k = norm(String(n)); if (k && !byKey.has(k)) { const it = { nick: '@' + k, recipe: null }; byKey.set(k, it); list.push(it); } }
  // Особые дома из базы (если подключена): накладываем рецепт на жителя или добавляем нового
  if (SUPABASE_URL) {
    try {
      const rows = await (await api('residents?select=nick,recipe,approved_at&status=eq.approved&order=approved_at.asc,id.asc')).json();
      for (const r of rows) { const ex = byKey.get(r.nick); if (ex) ex.recipe = r.recipe; else { const it = { nick: '@' + r.nick, recipe: r.recipe }; byKey.set(r.nick, it); list.push(it); } }
    } catch (e) { /* без особых домов город всё равно работает */ }
  }
  buildCity(list.slice(0, cells.length - 13));
}

// ---------- камера и отрисовка ----------
const cam = { x: 1.5, y: 1.5, z: 1, tx: 1.5, ty: 1.5, tz: 1 };
const TW = 64, TH = 32, HZ = 30;
function P(wx, wy, wz = 0) { const z = cam.z; return [W / 2 + ((wx - cam.x) - (wy - cam.y)) * TW / 2 * z, H * 0.56 + ((wx - cam.x) + (wy - cam.y)) * TH / 2 * z - wz * HZ * z]; }
function poly(pts, fill) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = fill; g.fill(); }
const stars = Array.from({ length: 160 }, (_, i) => { const r = rnd(i * 31 + 5); return [r(), r() * 0.6, 0.5 + r() * 1.6, r() * 6]; });
// ---------- день и ночь по Москве (?time=day|night — для проверки) ----------
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const FORCE = new URLSearchParams(location.search).get('time');
function dayAmount() {
  if (FORCE === 'day') return 1; if (FORCE === 'night') return 0;
  const d = new Date(), h = (d.getUTCHours() + 3) % 24 + d.getUTCMinutes() / 60;
  return sstep(7.5, 9, h) * (1 - sstep(16, 17.5, h));
}
const glow = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,214,140,.9)'); gr.addColorStop(.4, 'rgba(255,190,110,.35)'); gr.addColorStop(1, 'rgba(255,190,110,0)'); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c; })();
let TREES = [], CARS = [];
function buildNature(built) {
  TREES = []; const r = rnd(99);
  for (let i = built; i < cells.length; i++) { const v = r(); if (v < 0.5) TREES.push({ x: cells[i][0] + .25 + r() * .5, y: cells[i][1] + .25 + r() * .5, s: .7 + r() * .6, k: r() < .3 ? 1 : 0 }); }
  CARS = []; const span = Math.ceil(Math.sqrt(built + 20)) + 6, cr = rnd(5);
  const COLS = ['#ff4d6d', '#4dabf7', '#ffd43b', '#f8f9fa', '#63e6be', '#9775fa', '#ff922b'];
  for (let i = 0; i < Math.min(60, 10 + built / 25); i++) {
    const alongX = cr() < .5, dir = cr() < .5 ? 1 : -1;
    CARS.push({ alongX, dir, line: Math.round((cr() * 2 - 1) * span / 3) * 3 + (dir > 0 ? .25 : -.25), pos: (cr() * 2 - 1) * span, sp: 1.2 + cr() * 1.3, span, col: COLS[(cr() * COLS.length) | 0] });
  }
}
function drawPerson(o, b, night) {
  const s = cam.z * o.size, w = T * o.sp * 9 + o.ph, sw = Math.sin(w), bob = Math.abs(Math.cos(w)) * 1.1 * s;
  const face = o.alongX ? o.dir : -o.dir; // +1 смотрит вправо, -1 влево
  const dark = c => night > .5 ? mixc(c, '#1a1640', .25) : c;
  const x = b[0], y = b[1] - bob, hip = y - 8 * s, sh = y - 15 * s;
  g.lineCap = 'round';
  g.fillStyle = 'rgba(0,0,15,.32)'; g.beginPath(); g.ellipse(b[0], b[1], 5 * s, 2 * s, 0, 0, 7); g.fill();
  // дальняя рука и нога
  g.strokeStyle = dark(mixc(o.pants, '#000000', .25)); g.lineWidth = 2.6 * s; g.beginPath(); g.moveTo(x, hip); g.lineTo(x - sw * 3 * s, y); g.stroke();
  g.strokeStyle = dark(mixc(o.col, '#000000', .25)); g.lineWidth = 2.2 * s; g.beginPath(); g.moveTo(x, sh + s); g.lineTo(x + sw * 3 * s, sh + 6 * s); g.stroke();
  // ближняя нога
  g.strokeStyle = dark(o.pants); g.lineWidth = 2.6 * s; g.beginPath(); g.moveTo(x, hip); g.lineTo(x + sw * 3 * s, y); g.stroke();
  g.fillStyle = dark('#222'); g.beginPath(); g.ellipse(x + sw * 3 * s + face * .8 * s, y, 1.8 * s, 1 * s, 0, 0, 7); g.fill();
  // тело
  g.fillStyle = dark(o.col); g.beginPath(); g.roundRect(x - 3.6 * s, sh - 1 * s, 7.2 * s, 10 * s, 2.6 * s); g.fill();
  // ближняя рука
  g.strokeStyle = dark(o.col); g.lineWidth = 2.2 * s; g.beginPath(); g.moveTo(x, sh + s); g.lineTo(x - sw * 3 * s, sh + 6 * s); g.stroke();
  g.fillStyle = dark(o.skin); g.beginPath(); g.arc(x - sw * 3 * s, sh + 6.6 * s, 1.2 * s, 0, 7); g.fill();
  // голова
  const hx = x + face * .4 * s, hy = sh - 4.2 * s;
  if (o.style === 'long') { g.fillStyle = dark(o.hair); g.beginPath(); g.roundRect(hx - 4 * s, hy - 3 * s, 8 * s, 8 * s, 3 * s); g.fill(); }
  g.fillStyle = dark(o.skin); g.beginPath(); g.arc(hx, hy, 3.6 * s, 0, 7); g.fill();
  g.fillStyle = dark(o.hair);
  if (o.style === 'cap') {
    g.fillStyle = dark(o.capCol); g.beginPath(); g.arc(hx, hy - .6 * s, 3.8 * s, Math.PI, 2 * Math.PI); g.fill();
    g.beginPath(); g.ellipse(hx + face * 3.4 * s, hy - .6 * s, 2.6 * s, .9 * s, 0, 0, 7); g.fill();
  } else if (o.style === 'beanie') {
    g.fillStyle = dark(o.capCol); g.beginPath(); g.arc(hx, hy - .4 * s, 3.9 * s, Math.PI * 1.02, Math.PI * 1.98); g.fill(); g.fillRect(hx - 3.9 * s, hy - 1.2 * s, 7.8 * s, 1.4 * s);
    g.beginPath(); g.arc(hx, hy - 4.6 * s, 1.2 * s, 0, 7); g.fill();
  } else { g.beginPath(); g.arc(hx, hy - .8 * s, 3.8 * s, Math.PI * 1.05, Math.PI * 1.95); g.fill(); g.fillRect(hx - face * 3.6 * s - (face > 0 ? 0 : 1.2 * s), hy - 1.4 * s, 1.2 * s, 2.4 * s); }
  if (s > .8) { g.fillStyle = '#1a1238'; g.beginPath(); g.arc(hx + face * 1.8 * s, hy + .2 * s, .55 * s, 0, 7); g.fill(); }
  o.head = [hx, hy - 5 * s];
}
function drawTree(t, night) {
  const b = P(t.x, t.y), z = cam.z, s = t.s * z;
  g.fillStyle = 'rgba(0,0,15,.3)'; g.beginPath(); g.ellipse(b[0] + 3 * s, b[1] + 1 * s, 9 * s, 4 * s, 0, 0, 7); g.fill();
  g.fillStyle = mixc('#6b4a2b', '#3a2a24', night); g.fillRect(b[0] - 1.5 * s, b[1] - 9 * s, 3 * s, 9 * s);
  if (t.k) { // ёлка
    g.fillStyle = mixc('#2f9e44', '#14532d', night);
    for (let j = 0; j < 3; j++) { const y0 = b[1] - 8 * s - j * 7 * s, w = (10 - j * 2.5) * s; g.beginPath(); g.moveTo(b[0] - w, y0); g.lineTo(b[0] + w, y0); g.lineTo(b[0], y0 - 12 * s); g.closePath(); g.fill(); }
  } else {
    g.fillStyle = mixc('#51cf66', '#1d5a3a', night); g.beginPath(); g.arc(b[0], b[1] - 16 * s, 9 * s, 0, 7); g.fill();
    g.fillStyle = mixc('#8ce99a', '#2b7a4b', night); g.beginPath(); g.arc(b[0] - 3 * s, b[1] - 19 * s, 4.5 * s, 0, 7); g.fill();
  }
}
function drawCar(c, night) {
  const L = .32, Wd = .16, hz = .16, x = c.wx, y = c.wy;
  const [x0, x1, y0, y1] = c.alongX ? [x - L, x + L, y - Wd, y + Wd] : [x - Wd, x + Wd, y - L, y + L];

    g2.fillStyle = '#20423f'; g2.beginPath(); [P2(-.2, -.2), P2(1.2, -.2), P2(1.2, 1.2), P2(-.2, 1.2)].forEach((p, i) => i ? g2.lineTo(p[0], p[1]) : g2.moveTo(p[0], p[1])); g2.fill();
    CityHouse.draw(g2, P2, hs, performance.now() / 1000, 2.2); requestAnimationFrame(loop); };
  loop();
}
if (TG) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  document.getElementById('cta').textContent = '🎨 МОЙ ДОМ';
}

// ---------- выборы мэра (election.json) ----------
async function loadElection() {
  let E = null; try { const r = await fetch('election.json?v=' + Date.now()); if (r.ok) E = await r.json(); } catch (e) {}
  if (!E || !E.stage) return;
  const chip = document.createElement('button'); chip.className = 'chip'; chip.textContent = E.chip || '🗳 ВЫБОРЫ МЭРА'; document.getElementById('chips').appendChild(chip);
  chip.onclick = () => {
    const cands = (E.candidates || []).map((c, i) => `<div class="cand"><b>${i + 1}</b><div><div class="n">@${esc(norm(c.nick))}</div><div class="p">${esc(c.promise || '')}</div></div></div>`).join('');
    sheet.innerHTML = `<h2>${esc(E.title || 'Выборы мэра')}</h2><p>${esc(E.text || '')}</p>${cands}${E.until ? `<p>⏳ До: <b>${esc(E.until)}</b></p>` : ''}
      <div class="btns">${E.link ? `<a class="btn" href="${esc(E.link)}" target="_blank" rel="noopener">${esc(E.button || 'УЧАСТВОВАТЬ')}</a>` : ''}<button class="ghost" id="eclose" type="button">ЗАКРЫТЬ</button></div>`;
    modal.classList.add('show'); document.getElementById('eclose').onclick = () => modal.classList.remove('show');
  };
}
loadElection();
loadCity().then(() => {
  if (TG && ME) { const h = houses.find(x => x.key === ME); if (h) setTimeout(() => focus(h), 500); }
  if (location.hash.length > 1) { const k = norm(decodeURIComponent(location.hash.slice(1))); const h = houses.find(x => x.key === k); if (h) setTimeout(() => focus(h), 600); }
});
</script>

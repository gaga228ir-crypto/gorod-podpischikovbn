# Копирует сайт на SourceCraft (открывается в России без VPN) после каждого обновления.
# Нужны секреты репозитория: SC_REPO (https://git.sourcecraft.dev/ОРГ/РЕПО.git), SC_USER, SC_TOKEN.
name: Mirror to SourceCraft
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to SourceCraft
        env:
          SC_REPO: ${{ secrets.SC_REPO }}
          SC_USER: ${{ secrets.SC_USER }}
          SC_TOKEN: ${{ secrets.SC_TOKEN }}
        run: |
          if [ -z "$SC_REPO" ] || [ -z "$SC_TOKEN" ]; then echo "Секреты SourceCraft ещё не добавлены — пропускаю"; exit 0; fi
          URL="https://${SC_USER}:${SC_TOKEN}@${SC_REPO#https://}"
          git push --force "$URL" HEAD:main

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Превью дома</title>
<style>html,body{margin:0;background:#140c3a}canvas{display:block;width:640px;height:640px}</style></head>
<body><canvas id="c" width="640" height="640"></canvas>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<script type="module">
// Превью одного дома для бота: preview.html#<base64url JSON рецепта>. Когда готово — window.done = true.
import * as THREE from 'three';
import { makeHouse } from './city3d.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setSize(640, 640, false); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); s.background = new THREE.Color('#1a1240');
s.add(new THREE.HemisphereLight('#b3a6ff', '#2a1d55', 1.6)); const d = new THREE.DirectionalLight('#c8d2ff', 1.3); d.position.set(-3, 5, 3); s.add(d);
const pad = new THREE.Mesh(new THREE.BoxGeometry(1.6, .06, 1.6), new THREE.MeshStandardMaterial({ color: '#1d3b3a' })); pad.position.y = -.03; s.add(pad);
const ring = new THREE.Mesh(new THREE.BoxGeometry(1.9, .03, 1.9), new THREE.MeshStandardMaterial({ color: '#2c3155' })); ring.position.y = -.05; s.add(ring);
const c = new THREE.PerspectiveCamera(34, 1, .1, 50);
window.render = (rec, angle = .7) => {
  for (const o of [...s.children]) if (o.userData.house) s.remove(o);
  const g = makeHouse(rec); g.userData.house = true; g.rotation.y = angle; s.add(g);
  const h = Math.max(1.1, g.userData.top + .25); c.position.set(2.3, h * .75 + .7, 2.3 + h * .25); c.lookAt(0, h * .4, 0);
  r.render(s, c);
};
try {
  const b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
  if (b64) window.render(JSON.parse(decodeURIComponent(escape(atob(b64)))));
} catch (e) { console.error(e); }
await document.fonts.ready; window.done = true;
</script></body></html>

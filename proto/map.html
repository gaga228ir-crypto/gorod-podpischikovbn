<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Новая карта — прототип</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8fb;font-family:Inter,system-ui,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#hud b{font:800 18px system-ui;color:#1d2b44;background:rgba(255,255,255,.85);padding:8px 14px;border-radius:14px}
#hud a{font:700 14px system-ui;color:#1d2b44;background:rgba(255,255,255,.7);padding:8px 12px;border-radius:12px;text-decoration:none}
#hud a.on{background:#ff5a7a;color:#fff}
#info{position:fixed;left:12px;bottom:12px;font:600 12px system-ui;color:#1d2b44;background:rgba(255,255,255,.75);padding:6px 10px;border-radius:10px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><b id="ttl">Новая карта</b></div>
<div id="info"></div>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { VARIANTS, Terrain, buildRoads, buildLots, buildScene } from './map3d.js';
const q = new URLSearchParams(location.search), vk = VARIANTS[q.get('v')] ? q.get('v') : 'valley', V = VARIANTS[vk], COUNT = +(q.get('n') || 2300);
for (const k in VARIANTS) { const a = document.createElement('a'); a.href = '?v=' + k; a.textContent = VARIANTS[k].name; if (k === vk) a.className = 'on'; document.getElementById('hud').appendChild(a); }
const t0 = performance.now();
const T = new Terrain(V), roads = buildRoads(T, V.seed), lots = buildLots(T, roads, V.seed);
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.toneMapping = THREE.NeutralToneMapping; R.toneMappingExposure = 1.0; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#bfe1fa'); scene.fog = new THREE.Fog('#cfe6f7', 90, 230);
const res = buildScene(scene, T, roads, lots, COUNT, V.seed);
scene.add(new THREE.HemisphereLight('#e8f4ff', '#6f8f5a', 1.25));
const sun = new THREE.DirectionalLight('#fff3dc', 2.4); sun.position.set(-40, 60, 30); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = sc.bottom = -80; sc.right = sc.top = 80; sc.near = 1; sc.far = 220; sun.shadow.bias = -.0006; sun.shadow.normalBias = .03; scene.add(sun, sun.target);
const cam = new THREE.PerspectiveCamera(40, 1, .1, 600);
// камера: орбита вокруг цели (pan/zoom/rotate как в городе)
const ctl = { x: 0, z: 0, d: +(q.get('d') || 120), az: +(q.get('az') || .7), el: +(q.get('el') || .85) };
if (q.get('x')) { ctl.x = +q.get('x'); ctl.z = +q.get('z'); }
function place() { const y = Math.max(0, T.H(ctl.x, ctl.z)); cam.position.set(ctl.x + Math.sin(ctl.az) * Math.cos(ctl.el) * ctl.d, y + Math.sin(ctl.el) * ctl.d, ctl.z + Math.cos(ctl.az) * Math.cos(ctl.el) * ctl.d); cam.lookAt(ctl.x, y, ctl.z); }
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const ptr = new Map(); let two = null; const cv = R.domElement;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); two = null; });
cv.addEventListener('pointermove', e => { if (!ptr.has(e.pointerId)) return; const p = ptr.get(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), an = Math.atan2(b[1] - a[1], b[0] - a[0]); if (two) { ctl.d = Math.max(4, Math.min(220, ctl.d * two.d / d)); ctl.az -= an - two.a; } two = { d, a: an }; return; }
  const dx = e.clientX - p[0], dy = e.clientY - p[1];
  if (e.buttons === 2) { ctl.az -= dx * .006; ctl.el = Math.max(.25, Math.min(1.45, ctl.el + dy * .004)); return; }
  const k = ctl.d * .0018, s = Math.sin(ctl.az), c = Math.cos(ctl.az); ctl.x -= (dx * c + dy * s) * k; ctl.z -= (-dx * s + dy * c) * k; });
const up = e => { ptr.delete(e.pointerId); if (ptr.size < 2) two = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); ctl.d = Math.max(4, Math.min(220, ctl.d * Math.exp(e.deltaY * .0012))); }, { passive: false });
document.getElementById('info').textContent = `${V.name}: участков ${lots.length}, домов ${res.houses.length}, деревьев ${res.trees}, улиц ${roads.length} · ${Math.round(performance.now() - t0)} мс`;
window.__ready = true; window.__lots = lots.length;
(function loop() { place(); scene.fog.near = ctl.d * 1.3 + 20; scene.fog.far = ctl.d * 3.2 + 60; R.render(scene, cam); requestAnimationFrame(loop); })();
</script></body></html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Город подписчиков</title>
<meta name="description" content="Ночной город, где у каждого подписчика свой дом с ником.">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--bg:#070b24;--panel:rgba(12,8,36,.86);--gold:#ffd23f;--pink:#ff3d7f;--cyan:#5ef2ff;--text:#fff;--muted:#bdb6ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none}
html,body{background:radial-gradient(120% 80% at 50% 0%,#2a1d6b 0%,#120c38 45%,#070b24 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
#lbl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.prog{display:flex;align-items:center;gap:8px;background:rgba(12,8,36,.75);border:1px solid rgba(160,150,255,.3);border-radius:999px;padding:6px 12px 6px 10px;font:600 11px Inter,sans-serif;color:var(--muted);cursor:pointer;max-width:520px}
.prog b{color:#fff;font-weight:800}
.bar{flex:1;min-width:60px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:9px}
.top{position:fixed;left:0;right:0;top:0;padding:14px 16px 12px;background:linear-gradient(var(--panel),rgba(12,8,36,0));display:flex;flex-direction:column;gap:10px;z-index:2}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title h1{margin:0;font:800 18px/1.1 Unbounded,sans-serif;letter-spacing:.02em}
.count{font:500 12px Unbounded,sans-serif;color:var(--muted);white-space:nowrap}
.count b{color:var(--gold);font-weight:800;font-size:15px}
form.row{display:flex;gap:8px;max-width:520px}
input,textarea{width:100%;min-width:0;border:0;border-radius:999px;padding:12px 16px;font:600 16px Inter,sans-serif;background:#fff;color:#1a1238;outline:none}
textarea{border-radius:18px;resize:none;height:84px}
input:focus,textarea:focus{box-shadow:0 0 0 3px var(--pink)}
button,.btn{border:0;border-radius:999px;padding:12px 18px;font:800 13px Unbounded,sans-serif;cursor:pointer;background:var(--pink);color:#fff;text-decoration:none;white-space:nowrap;display:inline-block;text-align:center}
button:active,.btn:active{transform:scale(.96)}
button.ghost{background:rgba(255,255,255,.12)}
.msg{font:600 13px Inter,sans-serif;color:var(--gold);min-height:1em}
.card{position:fixed;left:50%;bottom:18px;transform:translate(-50%,160%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(160,150,255,.35);border-radius:22px;padding:16px 18px;width:min(92vw,420px);z-index:3;display:flex;align-items:center;gap:14px}
.card.show{transform:translate(-50%,0)}
.card .nick{font:800 18px Unbounded,sans-serif;color:var(--gold);word-break:break-all}
.card .sub{font:500 13px Inter,sans-serif;color:var(--muted);margin-top:4px}
.card .grow{flex:1;min-width:0}
.vbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin:6px 0 2px;overflow:hidden}.vbar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d7f,#ffd23f)}
.vbtn{padding:8px 14px!important;font-size:13px!important;align-self:center;flex:none}
.card .nb button{font:700 13px Inter,sans-serif;color:var(--gold);background:none;border:0;padding:0 2px;cursor:pointer;text-decoration:underline dotted}
.cta{position:fixed;right:16px;bottom:18px;z-index:2}
.card.show ~ .cta{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fxb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.fxb:empty{display:none}.fxb button{padding:7px 11px;font-size:10px;background:rgba(255,255,255,.12)}.fxb .k{font:800 12px Inter,sans-serif;color:#ff8fb8;align-self:center}
.shop{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}.shop span{flex:1;font:600 14px Inter,sans-serif}.shop button{padding:8px 12px;font-size:12px}
.klad{background:rgba(12,8,36,.8);color:#fff;border:1px solid rgba(255,210,63,.5);animation:none}
.klad.hot{background:var(--gold);color:#1a1238;animation:pulse 1s infinite}
.chip{border:0;border-radius:999px;padding:7px 12px;font:800 11px Unbounded,sans-serif;cursor:pointer;background:var(--gold);color:#1a1238;animation:pulse 2s infinite;text-decoration:none;display:inline-block}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,63,.25)}}
.share{background:var(--gold);color:#1a1238;padding:9px 12px;font-size:11px}
.cand{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.cand b{font:800 18px Unbounded,sans-serif;color:var(--gold);min-width:26px}
.cand .n{font:800 14px Unbounded,sans-serif}
.cand .p{color:var(--muted);font-size:14px}
.studio{display:flex;flex-direction:column;gap:12px}
.studio canvas{display:block;margin:0 auto;width:200px;height:200px;border-radius:18px;background:#191545}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:999px}
.tabs button{flex:1;background:transparent;padding:10px 6px;font-size:11px}
.tabs button.on{background:var(--pink)}
.srow{display:flex;flex-direction:column;gap:6px}
.srow>span{font:600 12px Inter,sans-serif;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:2px solid transparent;background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 10px;font:600 13px Inter,sans-serif;cursor:pointer}
.opt.on{border-color:var(--gold)}
.sw{width:34px;height:34px;padding:0;border-radius:50%}
.pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.hint{position:fixed;left:16px;bottom:24px;font:500 12px Inter,sans-serif;color:var(--muted);z-index:2;opacity:.8}
@media (max-width:520px){.hint{display:none}}
.modal{position:fixed;inset:0;background:rgba(5,3,20,.6);backdrop-filter:blur(4px);z-index:5;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#140c3a;border:1px solid rgba(160,150,255,.35);border-radius:26px 26px 0 0;padding:22px 18px 26px;width:min(100vw,480px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:26px}}
.sheet h2{margin:0;font:800 20px Unbounded,sans-serif}
.sheet p{margin:0;font:500 14px/1.45 Inter,sans-serif;color:var(--muted)}
.sheet p b{color:#fff}
.step{display:flex;gap:10px;align-items:flex-start;font:500 14px/1.4 Inter,sans-serif;color:var(--muted)}
.step i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font:800 12px/24px Unbounded,sans-serif;text-align:center}
.step a{color:var(--gold)}
.code{font:800 40px Unbounded,sans-serif;color:var(--gold);text-align:center;letter-spacing:.04em;padding:14px;border:2px dashed var(--gold);border-radius:18px}
.err{color:#ff8fae;font:600 13px Inter,sans-serif;min-height:1em}
.btns{display:flex;gap:8px}.btns>*{flex:1}
#load{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 0%,#2a1d6b 0%,#120c38 45%,#070b24 100%);transition:opacity .5s}
#load.hide{opacity:0;pointer-events:none}
#load .logo{font:800 26px/1.15 Unbounded,sans-serif;text-align:center;letter-spacing:.02em}
#load .logo b{color:var(--gold);font-weight:800}
#load .sky{display:flex;align-items:flex-end;gap:6px;height:70px}
#load .sky i{display:block;width:16px;border-radius:4px 4px 0 0;background:linear-gradient(var(--pink),#6b3fa0);animation:grow 1.2s ease-in-out infinite alternate}
#load .sky i:nth-child(2n){background:linear-gradient(var(--gold),#b8562f)}#load .sky i:nth-child(3n){background:linear-gradient(var(--cyan),#3d5a99)}
@keyframes grow{from{height:12px}to{height:70px}}
#load .lbar{width:min(70vw,260px);height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
#load .lbar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:9px;transition:width .4s}
#load .ltxt{font:600 13px Inter,sans-serif;color:var(--muted)}
</style>
</head>
<body>
<div id="load"><div class="sky"><i style="animation-delay:0s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.45s"></i><i style="animation-delay:.6s"></i><i style="animation-delay:.75s"></i><i style="animation-delay:.9s"></i></div><div class="logo">ГОРОД<br><b>ПОДПИСЧИКОВ</b></div><div class="lbar"><i id="lbarI"></i></div><div class="ltxt" id="ltxt">Загружаем город…</div></div>

<canvas id="c"></canvas>
<canvas id="lbl"></canvas>
<div class="top">
  <div class="title"><h1>ГОРОД ПОДПИСЧИКОВ</h1><div class="count">домов: <b id="cnt">0</b></div></div>
  <form class="row" id="f" autocomplete="off"><input id="q" placeholder="Найди свой дом: @ник" aria-label="Ник"><button>НАЙТИ</button></form>

  <div class="chips" id="chips"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="card" id="card"><div class="grow"><div class="nick" id="cnick"></div><div class="sub" id="csub"></div><div class="sub nb" id="cnb"></div><div class="fxb" id="cfx"></div></div><button class="share" id="cedit" style="display:none;background:var(--pink);color:#fff">🎨 ИЗМЕНИТЬ</button><button class="share" id="cshare">ПОДЕЛИТЬСЯ</button><button id="cclose" aria-label="Закрыть">✕</button></div>
<button class="btn cta" id="cta">🏠 ПОЛУЧИТЬ ДОМ</button>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="houses.js"></script>

<script type="module">
import { City3D, HousePreview, BIZ } from './city3d.js';
/* ===================== НАСТРОЙКИ ===================== */
const TIKTOK_URL = 'https://www.tiktok.com/@eben51041';
const TIKTOK_NICK = '@eben51041';
const BOT_URL = 'https://t.me/gorodpodpischikov_bot';
const CUSTOM_PRICE = 0; // конструктор бесплатно
const AI_PRICE = 15;   // дом по описанию (нейросеть)
const SUPABASE_URL = 'https://gqfipqimnhwiludpepbc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gj1pBQtVG9rFw3zbvu_2NA_e4I0TLiD';
const FALLBACK = ['@твой_ник'];
const CHAT_URL = 'https://t.me/+URDD6hcKo4ZlOTMy';
const KLAD_SALT = 'gorod-klad-v1'; // такой же KLAD_SALT в bot/.env
const CHECK_TIME = 'каждые 2 часа';
const MILESTONES_DEFAULT = [
  { at: 2500, name: 'Неоновый парк', type: 'park' }, { at: 5000, name: 'ТЦ «Неон»', type: 'mall' },
  { at: 10000, name: 'Школа', type: 'school' }, { at: 25000, name: 'Стадион', type: 'stadium' }, { at: 50000, name: 'Телебашня', type: 'tvtower' },
];
const HIDE = /1488|14\.88|14_88|88\.14|nazi|hitler|adolf|fuck|fak|sperma|sex|porno|dildo|penis|pisun|pisduk|pizd|puzd|pidor|pidar|pedik|gay|gei_|dolboeb|dolbaeb|dolbaep|droch|ebani|ebanu|zaeba|naeb|hui|huy|xyi|xye|xyu|zalup|drochi|dro4|mazafuk|bitch|dick|fag|negr|sukibl|blyat|blyad|govno|govna|kokain|kanabis|narko|nekushay/;
/* ===================================================== */
const $ = id => document.getElementById(id);
const norm = s => String(s || '').trim().replace(/^@+/, '').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const withTimeout = (ms) => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
const api = (path) => fetch(SUPABASE_URL + '/rest/v1/' + path, { signal: withTimeout(6000), headers: SUPABASE_ANON_KEY.startsWith('sb_') ? { apikey: SUPABASE_ANON_KEY } : { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } });
const getJSON = async (f) => { try { const r = await fetch(f + '?v=' + Date.now(), { signal: withTimeout(15000) }); return r.ok ? await r.json() : null; } catch (e) { return null; } };

let city;
try { city = new City3D($('c'), $('lbl')); } catch (e) { location.replace('2d.html' + location.search + location.hash); throw e; }
window.city = city;

// ---------- данные ----------
let houses = [], milestones = MILESTONES_DEFAULT, election = null;
const loadStep = (p, t) => { $('lbarI').style.width = p + '%'; if (t) $('ltxt').textContent = t; };
const hideLoad = () => { loadStep(100); setTimeout(() => $('load').classList.add('hide'), 250); setTimeout(() => $('load').remove(), 900); };
let baseList = [], hallInfo = null, specialRows = [], fxMap = {}, titles = {};
async function loadCity() {
  loadStep(20, 'Загружаем жителей…');
  const [base, ms, el] = await Promise.all([getJSON('subscribers.json'), getJSON('milestones.json'), getJSON('election.json')]);
  loadStep(60, 'Строим дома…');
  const src = Array.isArray(base) && base.length ? base : FALLBACK, byKey = new Map();
  for (const n of src) { const gone = String(n).startsWith('~'), k = norm(String(n).replace(/^~/, '')); if (k && !byKey.has(k)) { const it = { nick: '@' + k, key: k, recipe: null, gone }; byKey.set(k, it); baseList.push(it); } }
  baseList.forEach((it, i) => it.label = HIDE.test(it.key) && !/^user\d+$/.test(it.key) ? 'Житель №' + (i + 1) : it.nick);
  if (Array.isArray(ms) && ms.length) milestones = ms;
  election = el; hallInfo = election && election.winner ? { open: true, title: 'Ратуша · мэр @' + norm(election.winner) } : null;
  await new Promise(r => setTimeout(r, 30));
  buildCity();
  renderProgress(); renderElection(); renderKlad(); initAmbience();
  requestAnimationFrame(() => requestAnimationFrame(hideLoad));
  loadSpecial(byKey); // особые дома — в фоне: если база недоступна, город всё равно уже на экране
}
function buildCity() {
  const keep = city.hi && city.hi.key;
  city.treSeed = KLAD.seed; city.setCity(baseList, milestones, hallInfo);
  houses = city.houses; $('cnt').textContent = houses.filter(h => !h.gone).length.toLocaleString('ru');
  if (keep && city.byKey.get(keep)) city.focus(city.byKey.get(keep), false);
}
async function loadSpecial(byKey) {
  // 1) recipes.json рядом с сайтом — его выкладывает бот, открывается без VPN; 2) Supabase, если указан
  const apply = rows => { let n = 0; for (const r of rows || []) { const ex = byKey.get(norm(r.nick)), nr = r.recipe && CityHouse.normRecipe(r.recipe); if (ex && nr && !ex.gone) { ex.recipe = { ...r.recipe, ...nr }; n++; } } return n; };
  const rec = await getJSON('recipes.json'); specialRows = (rec || []).filter(r => r.recipe && r.recipe.name && byKey.has(norm(r.nick)));
  let n = apply(await getJSON('special.json')) + apply(rec); // special.json — дома по пожеланиям из комментов
  if (SUPABASE_URL) { try { n += apply(await (await api('residents?select=nick,recipe&status=eq.approved&recipe=not.is.null')).json()); } catch (e) {} }
  if (n) buildCity();
  fxMap = (await getJSON('fx.json')) || {}; city.setFx(fxMap);
  titles = (await getJSON('titles.json')) || {}; city.setTitles(titles);
  updateHonor();
}
function renderProgress() {
  const N = houses.filter(h => !h.gone).length, next = milestones.find(m => N < m.at), el = $('prog');
  if (!next) { el.hidden = true; return; }
  const prev = [...milestones].reverse().find(m => N >= m.at), from = prev ? prev.at : 0, p = Math.max(2, Math.min(100, (N - from) / (next.at - from) * 100));
  el.innerHTML = `🏗 До «<b>${esc(next.name)}</b>»<span class="bar"><i style="width:${p}%"></i></span><b>${N.toLocaleString('ru')}/${next.at.toLocaleString('ru')}</b>`;
  el.hidden = false;
  el.onclick = () => { const i = milestones.indexOf(next) + 1, lm = city.landmarks[i]; if (lm) city.flyTo(lm.position.x, lm.position.z, 10); };
}

// ---------- управление ----------
const cv = $('c'); const ptrs = new Map(); let drag = null, two = null;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); drag = { moved: 0, btn: e.button }; cv.classList.add('drag'); two = null; });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (two) { city.zoom(two.d / d); city.rotate(ang - two.a); } two = { d, a: ang }; if (drag) drag.moved += 99; return; }
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; if (drag) drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag && drag.btn === 2) city.rotate(dx * .006); else city.pan(dx, dy);
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) two = null; cv.classList.remove('drag'); if (drag && drag.moved < 8 && ptrs.size === 0) pick(e.clientX, e.clientY); if (!ptrs.size) drag = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); city.zoom(Math.exp(e.deltaY * .0012)); }, { passive: false });

let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; city.frame(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ---------- карточка, поиск, поделиться ----------
const card = $('card'), msg = $('msg');
function pick(x, y) { const h = city.pick(x, y); if (h && h.honor) return openHonor(); if (h && h.chest) return kladOver() ? kladChip.onclick() : openKlad(); if (h) focus(h, false); }
function focus(h, fly = true) {
  city.focus(h, fly);
  $('cnick').textContent = h.label;
  $('csub').textContent = h.gone ? `Дом №${h.n.toLocaleString('ru')} · заброшен: житель отписался 😢 Подпишись снова — свет вернётся` : `Дом №${h.n.toLocaleString('ru')}${h.recipe ? ' · особый дом' : ''}${h.recipe && h.recipe.biz && BIZ[h.recipe.biz] ? ' · ' + BIZ[h.recipe.biz][0].toLowerCase() : ''}`;
  const ad = city.address(h); $('csub').textContent = `📍 ${ad.text} · ${ad.district} · ` + $('csub').textContent;
  const nb = city.neighbors(h).filter(o => !o.h.gone); $('cnb').innerHTML = nb.length ? 'Соседи: ' + nb.map((o, i) => `${o.rel} <button data-i="${i}">${esc(o.h.label)}</button>`).join(' · ') : '';
  $('cnb').querySelectorAll('button').forEach(b => b.onclick = () => focus(nb[+b.dataset.i].h));
  $('cedit').style.display = (TG && h.key === ME) ? '' : 'none';
  const fx = fxMap[h.key] || {}, mine = TG && h.key === ME;
  $('cfx').innerHTML = h.gone ? '' : (titles[h.key] ? `<span class="k" style="color:var(--gold)">🏅 ${esc(titles[h.key].t)}</span>` : '') + (fx.k ? `<span class="k">❤ ${fx.k}</span>` : '') + (fx.s ? `<span class="k" style="color:#fff">💬 ${esc(fx.s)}</span>` : '')
    + (mine ? '<button type="button" id="bfx">✏️ ТАБЛИЧКА</button><button type="button" id="bshop">⭐ УКРАСИТЬ</button>' : TG && ME ? '<button type="button" id="bknock">🚪 ПОСТУЧАТЬ</button>' : '');
  if ($('bfx')) $('bfx').onclick = () => openFx(h); if ($('bshop')) $('bshop').onclick = () => openShop(h); if ($('bknock')) $('bknock').onclick = () => sendTG({ t: 'knock', n: h.key });
  card.classList.add('show'); history.replaceState(null, '', location.search + '#' + encodeURIComponent(h.key));
}
$('cedit').onclick = () => openStudio();

// ---------- день/ночь и погода ----------
const GSET_DEF = { day: 'auto', tz: 'device', wx: 'auto' };
let gset = { ...GSET_DEF }; try { Object.assign(gset, JSON.parse(localStorage.getItem('gset') || '{}')); } catch (e) {}
const TZS = [['device', 'Как на телефоне'], ['2', 'UTC+2 · Калининград'], ['3', 'UTC+3 · Москва, СПб'], ['4', 'UTC+4 · Самара'], ['5', 'UTC+5 · Екатеринбург'], ['6', 'UTC+6 · Омск'], ['7', 'UTC+7 · Новосибирск'], ['8', 'UTC+8 · Иркутск'], ['9', 'UTC+9 · Якутск'], ['10', 'UTC+10 · Владивосток'], ['11', 'UTC+11 · Магадан'], ['12', 'UTC+12 · Камчатка']];
const localHour = () => { const d = new Date(); if (gset.tz === 'device') return d.getHours() + d.getMinutes() / 60; const h = d.getUTCHours() + d.getUTCMinutes() / 60 + +gset.tz; return (h + 24) % 24; };
const sstep = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const daylight = () => gset.day === 'night' ? 0 : gset.day === 'day' ? 1 : (h => sstep(6.3, 8, h) * (1 - sstep(17, 18.7, h)))(localHour());
function autoWeather() { // одна погода на всех: меняется каждые 3 часа, зависит от сезона
  const d = new Date(), m = d.getUTCMonth(), r = fnv('wx:' + d.toISOString().slice(0, 10) + ':' + Math.floor(d.getUTCHours() / 3)) % 100;
  const w = m === 11 || m <= 1 ? [['snow', 60], ['fog', 70]] : m === 10 || m === 2 ? [['snow', 30], ['rain', 50], ['fog', 60]] : [['rain', 22], ['fog', 28]];
  for (const [k, p] of w) if (r < p) return k; return 'clear';
}
const curWeather = () => gset.wx === 'auto' ? autoWeather() : gset.wx === 'off' ? 'clear' : gset.wx;
const WX_ICON = { clear: '', snow: '❄️', rain: '🌧', fog: '🌫' };

// ---------- клад дня ----------
const fnv = s => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const mskDay = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
const KLAD = (d => ({ day: d, code: String(1000 + fnv(KLAD_SALT + ':code:' + d) % 9000), seed: fnv(KLAD_SALT + ':pos:' + d) }))(mskDay());
let kladState = null; // klad.json от бота: {day, taken, limit}
const kladOver = () => !!(kladState && kladState.day === KLAD.day && kladState.taken >= kladState.limit);
const kladLeft = () => kladState && kladState.day === KLAD.day ? Math.max(0, kladState.limit - kladState.taken) : null;
async function loadKladState() { const j = await getJSON('klad.json'); if (j && j.day) kladState = j; if (city.chest) city.chest.visible = !kladOver(); updateHonor(); }
const kladFound = () => { try { return localStorage.getItem('klad') === KLAD.day; } catch (e) { return false; } };
let kladChip = null;
function renderKlad() {
  kladChip = document.createElement('button'); kladChip.className = 'chip klad'; $('chips').appendChild(kladChip);
  if (CHAT_URL) { const ch = document.createElement('a'); ch.className = 'chip'; ch.href = CHAT_URL; ch.target = '_blank'; ch.rel = 'noopener'; ch.textContent = '💬 ЧАТ ЖИТЕЛЕЙ'; ch.onclick = e => { if (TG && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(CHAT_URL); } }; $('chips').appendChild(ch); }
  kladChip.onclick = () => { if (kladOver()) { sheet.innerHTML = `<h2>💎 Клад на сегодня разобран</h2><p>Все ${kladState.limit} призов уже забрали 🎉 Новый сундук спрячется в городе в <b>00:00 МСК</b> — приходи пораньше!</p><button class="ghost" id="mclose">ПОНЯЛ</button>`; modal.classList.add('show'); return closeBtn(); } if (kladFound()) return openKlad(); sheet.innerHTML = `<h2>💎 Клад дня</h2><p>Каждый день в городе прячется сундук. Найди его между домами — подсказка вверху: <b>холодно → тепло → горячо</b>. Подойди поближе (приблизь камеру) и нажми на сундук.</p><p>Приз — <b>дом по описанию бесплатно</b>: нейросеть построит любую твою идею в 3D. Новый клад — каждый день в 00:00 МСК.</p><button class="ghost" id="mclose">ИСКАТЬ</button>`; modal.classList.add('show'); closeBtn(); };
  setInterval(updKlad, 250); updKlad(); loadKladState(); setInterval(loadKladState, 120000);
}

  if (city.chest) city.chest.visible = !kladOver();
  if (kladOver()) { kladChip.className = 'chip klad'; kladChip.textContent = '💎 КЛАД РАЗОБРАН · НОВЫЙ В 00:00'; return; }
  if (kladFound()) { kladChip.className = 'chip klad'; kladChip.textContent = '💎 КЛАД НАЙДЕН · КОД'; return; }
  const d = city.treasureDist(), t = d < 2.5 ? ['🔥 ГОРЯЧО!', 1] : d < 6 ? ['♨️ ОЧЕНЬ ТЕПЛО', 1] : d < 14 ? ['🌤 ТЕПЛО', 0] : d < 30 ? ['❄️ ПРОХЛАДНО', 0] : ['🧊 ХОЛОДНО', 0];
  kladChip.textContent = '💎 КЛАД ДНЯ · ' + t[0]; kladChip.className = 'chip klad' + (t[1] ? ' hot' : '');
}
function openKlad() {

  const deep = BOT_URL ? BOT_URL.replace(/\/$/, '') + '?start=klad' + KLAD.code : '';
  sheet.innerHTML = `<h2>💎 Ты нашёл клад!</h2><p>Твой код на сегодня:</p><div class="code">КЛАД-${KLAD.code}</div>

    <div class="err" id="kerr"></div>
    <div class="btns"><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button>${TG ? '<button id="kgo" type="button">ЗАБРАТЬ ПРИЗ</button>' : deep ? `<a class="btn" href="${esc(deep)}">ЗАБРАТЬ В БОТЕ</a>` : ''}</div>

function renderElection() {

        + `</div><div style="display:flex;flex-direction:column;gap:6px;align-self:center">${city.byKey.get(norm(c.nick)) ? `<button class="vbtn ghost" type="button" data-home="${esc(norm(c.nick))}">🏠 ДОМ</button>` : ''}${open2 && c.vote ? `<a class="btn vbtn tglink" href="${esc(c.vote)}" target="_blank" rel="noopener">ЗА</a>` : ''}</div></div>`; }).join('')
      || (open2 ? '<p>Кандидатов пока нет — стань первым! 🙋</p>' : '');
    sheet.innerHTML = `<h2>${esc(E.title || 'Выборы мэра')}</h2><p>${esc(E.text || '')}</p>${cands}${E.until ? `<p>⏳ До: <b>${esc(E.until)}</b></p>` : ''}
      <div class="btns">${open2 && E.apply ? `<a class="btn tglink" href="${esc(E.apply)}" target="_blank" rel="noopener">🙋 СТАТЬ КАНДИДАТОМ</a>` : ''}${E.link && !open2 ? `<a class="btn" href="${esc(E.link)}" target="_blank" rel="noopener">${esc(E.button || 'УЧАСТВОВАТЬ')}</a>` : ''}<button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button></div>`;
    sheet.querySelectorAll('.tglink').forEach(a => a.onclick = e => { if (TG && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(a.href); } });
    sheet.querySelectorAll('[data-home]').forEach(b => b.onclick = () => { const h = city.byKey.get(b.dataset.home); if (h) { modal.classList.remove('show'); focus(h); } });
    modal.classList.add('show'); closeBtn();
  };
}

// ---------- «Получить дом» / мини-приложение ----------
if (/tgWebApp/.test(location.hash + location.search) || window.TelegramWebviewProxy) await new Promise(res => { const sc = document.createElement('script'); sc.src = 'https://telegram.org/js/telegram-web-app.js'; sc.onload = sc.onerror = res; document.head.appendChild(sc); setTimeout(res, 5000); });
const tg = window.Telegram && window.Telegram.WebApp;
const TG = !!(tg && tg.platform && tg.platform !== 'unknown');
const GIFT = new URLSearchParams(location.search).get('gift') === '1';
const ME = norm(new URLSearchParams(location.search).get('me') || '');
const WALL_C = ['#ffcf4a', '#f28b82', '#a7d36f', '#7cc8ff', '#c9a0e8', '#f7a8d0', '#86d4c8', '#9aa3b5'];
const ROOF_C = ['#d1404f', '#3d5a99', '#6b3fa0', '#2f7a6b', '#b8562f', '#374070'];
const SHAPE_N = { house: 'Домик', tower: 'Башня', castle: 'Замок', skyscraper: 'Небоскрёб', dome: 'Купол', clocktower: 'Часы' };
const EMB = { none: '✖', sun: '☀️', moon: '🌙', star: '⭐', heart: '❤️', clock: '🕐', crown: '👑', flame: '🔥', leaf: '🍃', lightning: '⚡', diamond: '💎', snake: '🐍' };
const LIGHT_N = { warm: '🟡', cool: '🔵', pink: '🩷', green: '🟢' };
$('cta').onclick = () => {
  if (TG) return openStudio();
  if (BOT_URL) { location.href = BOT_URL; return; }
  sheet.innerHTML = `<h2>Получить дом</h2><p>1 подписка = 1 дом с твоим ником. Подпишись на <a style="color:var(--gold)" href="${TIKTOK_URL}" target="_blank" rel="noopener">${TIKTOK_NICK}</a> — новые жители заселяются ${CHECK_TIME}.</p><div class="btns"><a class="btn" href="${TIKTOK_URL}" target="_blank" rel="noopener">ПОДПИСАТЬСЯ</a><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button></div>`;
  modal.classList.add('show'); closeBtn();
};
let studio = { tab: GIFT ? 'ai' : 'free', preset: 0, r: { ...CityHouse.PRESETS[0].r } }, preview = null;
function openStudio() {
  if (!ME) {
    sheet.innerHTML = TG ? `<h2>Мой дом</h2><p>Город открыт без твоего ника 🤔 Нажми кнопку — бот пришлёт правильную кнопку «🏙 Открыть город» с твоим домом и подарками.</p><p>Если ник ещё не привязан — бот подскажет, как это сделать.</p><div class="btns"><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button><button id="whoami" type="button">🔄 МОЯ КНОПКА</button></div>`
      : `<h2>Мой дом</h2><p>Сначала привяжи свой ник TikTok в боте — кнопка «🏠 Мой дом».</p><button class="ghost" id="mclose">ЗАКРЫТЬ</button>`;
    modal.classList.add('show'); closeBtn(); if ($('whoami')) $('whoami').onclick = () => sendTG({ t: 'me' }); return; }
  const mine = city.byKey.get(ME); if (mine && mine.recipe) studio.r = { ...mine.recipe };
  renderStudio(); modal.classList.add('show');
}
const DECOR_N = { garland: '🎄 Гирлянда', tree: '🌲 Ёлка', car: '🚗 Машина', pet: '🐶 Питомец' };
function renderStudio() {
  const S = studio, R = S.r, opts = (key, list, fmt) => list.map(v => `<button class="opt ${R[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${fmt(v)}</button>`).join('');
  const sw = (key, list) => list.map(v => `<button class="opt sw ${R[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}" style="background:${v}"></button>`).join('');
  const dec = new Set(R.decor || []);
  const go = S.tab === 'free' ? 'ВЫБРАТЬ' : S.tab === 'ai' ? (GIFT ? 'ПОСТРОИТЬ БЕСПЛАТНО 🎁' : `ПОСТРОИТЬ · ${AI_PRICE} ⭐ / 🎁`) : (CUSTOM_PRICE ? 'ОПЛАТИТЬ ' + CUSTOM_PRICE + ' ⭐' : 'СОХРАНИТЬ');
  sheet.innerHTML = `<div class="studio"><h2>Мой дом · @${esc(ME)}</h2>
    ${S.tab === 'ai' ? '' : '<canvas id="prev" style="width:200px;height:200px"></canvas>'}
    <div class="tabs"><button data-tab="free" class="${S.tab === 'free' ? 'on' : ''}">5 ГОТОВЫХ</button><button data-tab="pro" class="${S.tab === 'pro' ? 'on' : ''}">КОНСТРУКТОР</button><button data-tab="ai" class="${S.tab === 'ai' ? 'on' : ''}">✨ ПО ОПИСАНИЮ</button></div>
    ${S.tab === 'free' ? `<div class="pre">${CityHouse.PRESETS.map((p, i) => `<button class="opt ${S.preset === i ? 'on' : ''}" data-pre="${i}">${esc(p.name)}</button>`).join('')}</div>` : S.tab === 'ai' ? `
    <p>Опиши дом мечты — <b>нейросеть соберёт его в 3D</b> из деталей: ракета, пончик, замок, дом-кот… Перед тем как поставить в город, дом проверит мэрия. Если не получится — звёзды вернём.</p>
    <textarea id="aitext" maxlength="300" placeholder="Например: дом-ракета с иллюминаторами и огнём из сопел">${esc(S.ai || '')}</textarea>` : `
    <div class="srow"><span>Форма</span><div class="opts">${opts('shape', CityHouse.SHAPES, v => SHAPE_N[v])}</div></div>
    <div class="srow"><span>Стены</span><div class="opts">${sw('wall', WALL_C)}</div></div>
    <div class="srow"><span>Крыша</span><div class="opts">${sw('roof', ROOF_C)}</div></div>
    <div class="srow"><span>Этажи</span><div class="opts">${opts('floors', [1, 2, 3, 4, 5, 6], v => v)}</div></div>
    <div class="srow"><span>Знак на фасаде</span><div class="opts">${opts('emblem', CityHouse.EMBLEMS, v => EMB[v])}</div></div>
    <div class="srow"><span>Свет в окнах</span><div class="opts">${opts('lights', CityHouse.LIGHTS, v => LIGHT_N[v])}</div></div>
    <div class="srow"><span>Декор · 📢 бонус подписчикам ТГ-канала</span><div class="opts">${Object.entries(DECOR_N).map(([k, n]) => `<button class="opt ${dec.has(k) ? 'on' : ''}" data-dec="${k}">${n}</button>`).join('')}</div></div>`}
    <div class="err" id="serr"></div>
    <div class="btns"><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button><button id="sgo" type="button">${go}</button></div></div>`;
  sheet.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { if (S.tab === 'ai') S.ai = ($('aitext') || {}).value || S.ai; S.tab = b.dataset.tab; if (S.tab === 'free') S.r = { ...CityHouse.PRESETS[S.preset].r }; renderStudio(); });
  sheet.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { S.preset = +b.dataset.pre; S.r = { ...CityHouse.PRESETS[S.preset].r }; renderStudio(); });
  sheet.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; R[k] = k === 'floors' ? +b.dataset.v : b.dataset.v; renderStudio(); });
  sheet.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { const d = new Set(R.decor || []); d.has(b.dataset.dec) ? d.delete(b.dataset.dec) : d.add(b.dataset.dec); R.decor = [...d]; renderStudio(); });
  closeBtn();
  $('sgo').onclick = () => {
    let data;
    if (S.tab === 'free') data = { t: 'preset', i: S.preset };
    else if (S.tab === 'ai') { const d = ($('aitext').value || '').trim(); if (d.length < 5) { $('serr').textContent = 'Опиши дом хотя бы парой слов 🙂'; return; } data = { t: 'ai', d }; }
    else data = { t: 'custom', r: { ...CityHouse.normRecipe(R), decor: R.decor || [] } };
    try { sendTG(data); } catch (e) { $('serr').textContent = 'Открой город кнопкой «🏙 Открыть город» внизу чата с ботом — тогда выбор отправится.'; }
  };
  if (preview) preview.alive = false; preview = null;
  if ($('prev')) { preview = new HousePreview($('prev')); preview.set(R); }
}
if (TG) { try { tg.ready(); tg.expand(); } catch (e) {} $('cta').textContent = '🎨 МОЙ ДОМ'; }

loadCity().then(() => {
  const k = norm(decodeURIComponent(location.hash.slice(1))) || (TG ? ME : '');
  const h = k && city.byKey.get(k); if (h) setTimeout(() => focus(h), 400);
});
</script>
</body>
</html>

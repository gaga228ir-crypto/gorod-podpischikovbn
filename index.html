<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Город подписчиков</title>
<meta name="description" content="Город у озера, где у каждого подписчика свой дом с ником.">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* Светлая тема: белое «стекло» поверх дневного города, тёмно-синий текст, тёплые акценты */
:root{--bg:#cfe8fb;--panel:rgba(255,255,255,.93);--line:rgba(29,43,68,.1);--gold:#ffc83d;--goldt:#c27c00;--pink:#ff5a7a;--cyan:#2bb5d8;--green:#2e9d4f;--text:#1d2b44;--muted:#5d6b82;--soft:rgba(29,43,68,.06);--shadow:0 8px 28px rgba(29,43,68,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;background:linear-gradient(#a9d2f5,#e4f1fb 55%,#cfe3c4)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
#lbl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* шапка */
.top{position:fixed;left:0;right:0;top:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;z-index:2;pointer-events:none}
.top>*{pointer-events:auto}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;width:100%}
.title h1{margin:0;font:800 17px/1.1 Unbounded,sans-serif;letter-spacing:.02em;color:var(--text);text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 14px rgba(255,255,255,.9)}
.count{font:600 12px Inter,sans-serif;color:var(--muted);white-space:nowrap;background:var(--panel);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow)}
.count b{color:var(--text);font:800 14px Unbounded,sans-serif}
form.row{display:flex;gap:6px;max-width:560px;background:var(--panel);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
input,textarea{width:100%;min-width:0;border:0;border-radius:999px;padding:11px 14px;font:600 16px Inter,sans-serif;background:transparent;color:var(--text);outline:none}
.sheet input,.sheet textarea{background:#f2f5f9;border:1px solid var(--line)}
textarea{border-radius:16px;resize:none;height:84px}
input::placeholder,textarea::placeholder{color:#8a96a8}
.sheet input:focus,.sheet textarea:focus{box-shadow:0 0 0 3px rgba(255,90,122,.35)}
button,.btn{border:0;border-radius:999px;padding:12px 18px;font:800 12px Unbounded,sans-serif;cursor:pointer;background:var(--pink);color:#fff;text-decoration:none;white-space:nowrap;display:inline-block;text-align:center;box-shadow:0 4px 14px rgba(255,90,122,.3)}
button:active,.btn:active{transform:scale(.96)}
button.ghost{background:var(--soft);color:var(--text);box-shadow:none}
.msg{font:600 13px Inter,sans-serif;color:var(--goldt);min-height:0}
.msg:empty{display:none}
.msg:not(:empty){background:var(--panel);padding:8px 12px;border-radius:14px;box-shadow:var(--shadow);max-width:560px}
/* прогресс до следующего здания */
.prog{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:7px 12px 7px 10px;font:600 11px Inter,sans-serif;color:var(--muted);cursor:pointer;max-width:560px;box-shadow:var(--shadow)}
.prog b{color:var(--text);font-weight:800}
.bar{flex:1;min-width:60px;height:7px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a8f,#ffc83d);border-radius:9px}
/* меню */
.ic{width:1.9em;height:1.9em;vertical-align:middle;margin:-.55em .3em -.45em -.25em;pointer-events:none}
h2 .ic{width:1.5em;height:1.5em;margin:-.3em .25em -.2em 0}
#cshare .ic,#clook .ic{width:1.7em;height:1.7em}
.chip{border:0;border-radius:999px;padding:8px 12px;font:800 11px Unbounded,sans-serif;cursor:pointer;background:var(--panel);color:var(--text);text-decoration:none;display:inline-block;box-shadow:var(--shadow)}
#menuBtn{align-self:flex-start;background:var(--gold);color:var(--text)}#menuBtn.open{background:var(--text);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:560px}.chips:not(.open){display:none}
.chips .chip{animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,200,61,.35)}}
.klad{background:var(--panel);color:var(--text);border:2px solid var(--gold)}
.klad.hot{background:var(--gold);color:var(--text);animation:pulse 1s infinite}
/* карточка дома */
.card{position:fixed;left:50%;bottom:16px;transform:translate(-50%,160%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);background:var(--panel);border-radius:22px;padding:16px 18px;width:min(94vw,430px);z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:10px 10px;max-height:62vh;overflow-y:auto;box-shadow:0 16px 50px rgba(29,43,68,.25)}
.card .grow{flex:1 1 100%;min-width:0;order:0}
.card>button{order:1}.card #cclose{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--soft);color:var(--text);box-shadow:none}
.card.show{transform:translate(-50%,0)}
.card .nick{font:800 18px Unbounded,sans-serif;color:var(--text);word-break:break-all;padding-right:40px}
.card .sub{font:500 13px Inter,sans-serif;color:var(--muted);margin-top:4px}
.card .nb button{font:700 13px Inter,sans-serif;color:var(--pink);background:none;border:0;padding:0 2px;cursor:pointer;text-decoration:underline dotted;box-shadow:none}
.vbar{height:7px;border-radius:4px;background:var(--soft);margin:6px 0 2px;overflow:hidden}.vbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a8f,#ffc83d)}
.vbtn{padding:8px 14px!important;font-size:12px!important;align-self:center;flex:none}
.fxb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.fxb:empty{display:none}.fxb button{padding:7px 11px;font-size:10px;background:var(--soft);color:var(--text);box-shadow:none}.fxb .k{font:800 12px Inter,sans-serif;color:var(--pink);align-self:center}
.share{background:var(--gold);color:var(--text);padding:9px 12px;font-size:11px;box-shadow:none}
.cta{position:fixed;right:16px;bottom:18px;z-index:2;box-shadow:0 8px 26px rgba(255,90,122,.45)}
#toCity{position:fixed;right:16px;top:150px;z-index:3;display:none;background:#fff;color:var(--text);box-shadow:var(--shadow)}
#toCity.show{display:block}body.orbiting #toCity{display:none!important}
.card.show ~ .cta{display:none}
body.orbiting .top,body.orbiting #card,body.orbiting #cta{display:none!important}
.hint{position:fixed;left:16px;bottom:22px;font:600 12px Inter,sans-serif;color:var(--muted);z-index:2;background:rgba(255,255,255,.75);padding:6px 10px;border-radius:10px}
@media (max-width:520px){.hint{display:none}}
/* окна (выборы, клад, дума, студия…) */
.modal{position:fixed;inset:0;background:rgba(29,43,68,.35);z-index:5;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:22px 18px 26px;width:min(100vw,480px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(29,43,68,.2)}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:26px}}
.modal.placing{background:none!important;pointer-events:none;align-items:flex-end!important}
.modal.placing .sheet{pointer-events:auto;padding:10px 14px 14px;gap:4px;border-radius:20px 20px 0 0!important;background:rgba(255,255,255,.94);max-height:46vh}
.modal.placing .sheet p{display:none}.modal.placing .sheet h2{font-size:15px;margin:0}.modal.placing .srow{margin:0}
.sheet h2{margin:0;font:800 19px Unbounded,sans-serif;color:var(--text)}
.sheet p{margin:0;font:500 14px/1.45 Inter,sans-serif;color:var(--muted)}
.sheet p b{color:var(--text)}
.sheet a{color:var(--pink)}.sheet a.btn{color:#fff}
.shop{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px}.shop span{flex:1;font:600 14px Inter,sans-serif}.shop button{padding:8px 12px;font-size:11px}
.cand{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px}
.cand b{font:800 18px Unbounded,sans-serif;color:var(--goldt);min-width:26px}
.cand .n{font:800 14px Unbounded,sans-serif}
.cand .p{color:var(--muted);font-size:14px}
.studio{display:flex;flex-direction:column;gap:12px}
.studio canvas{display:block;margin:0 auto;width:200px;height:200px;border-radius:18px;background:linear-gradient(#cfe6fb,#eef6e8)}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px}
.tabs button{flex:1;background:transparent;color:var(--text);padding:10px 6px;font-size:11px;box-shadow:none}
.tabs button.on{background:var(--pink);color:#fff}
.srow{display:flex;flex-direction:column;gap:6px}
.srow>span{font:600 12px Inter,sans-serif;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:2px solid transparent;background:var(--soft);color:var(--text);border-radius:12px;padding:8px 10px;font:600 13px Inter,sans-serif;cursor:pointer}
.opt.on{border-color:var(--pink);background:#fff}
.opt,.sw{box-shadow:none}.opt.hn{background:none;border:0;padding:0;font:800 14px Unbounded,sans-serif;color:var(--text)}
@media (max-width:520px){.title h1{font-size:13px}.count{font-size:11px;padding:5px 10px}.count b{font-size:12px}}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;font:500 14px/1.4 Inter,sans-serif;color:var(--muted)}
.step i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font:800 12px/24px Unbounded,sans-serif;text-align:center}
.step a{color:var(--pink)}
.code{font:800 40px Unbounded,sans-serif;color:var(--text);text-align:center;letter-spacing:.04em;padding:14px;border:2px dashed var(--pink);border-radius:18px;background:#fff6f8}
.err{color:#d6334f;font:600 13px Inter,sans-serif;min-height:1em}
.btns{display:flex;gap:8px}.btns>*{flex:1}
/* заставка: небо, облака, домики растут один за другим */
#load{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#7fbbee,#cfe7fb 58%,#e9f5ff);transition:opacity .5s}
#load.hide{opacity:0;pointer-events:none}
#load .sun{position:absolute;top:9%;right:14%;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,#fff7c8 0,#ffd75e 55%,rgba(255,200,61,0) 72%);animation:sunp 3s ease-in-out infinite alternate}
@keyframes sunp{to{transform:scale(1.08)}}
#load .cl{position:absolute;height:26px;width:90px;border-radius:30px;background:#fff;opacity:.9;animation:drift linear infinite}
#load .cl::before,#load .cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
#load .cl::before{width:44px;height:44px;left:14px;top:-22px}#load .cl::after{width:32px;height:32px;left:46px;top:-14px}
#load .c1{top:17%;animation-duration:26s;left:-120px}#load .c2{top:30%;animation-duration:38s;animation-delay:-18s;left:-120px;transform:scale(.7)}#load .c3{top:8%;animation-duration:32s;animation-delay:-8s;left:-120px;transform:scale(.55)}
@keyframes drift{to{left:110%}}
#load .stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.4px 1.4px at 32% 9%,#fff,transparent),radial-gradient(1.8px 1.8px at 58% 22%,#fff,transparent),radial-gradient(1.3px 1.3px at 76% 12%,#fff,transparent),radial-gradient(1.6px 1.6px at 88% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 34%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 40%,#fff,transparent)}
#load .hill{position:absolute;left:-10%;right:-10%;bottom:-38vh;height:70vh;border-radius:50%;background:radial-gradient(ellipse at 50% 0,#9fd67f,#6fb85a 60%);box-shadow:0 -6px 0 #b7e59b inset}
#load .town{position:relative;display:flex;align-items:flex-end;gap:7px;height:92px;margin-bottom:18px;z-index:1}
#load .h{position:relative;display:block;width:34px;border-radius:4px 4px 2px 2px;transform-origin:50% 100%;transform:scaleY(0);animation:rise 4.2s cubic-bezier(.3,1.5,.5,1) infinite;background:linear-gradient(90deg,transparent 22%,rgba(255,255,255,.85) 22% 40%,transparent 40% 60%,rgba(255,255,255,.85) 60% 78%,transparent 78%) 0 9px/100% 10px repeat-y,var(--w,#ffe1c7);box-shadow:inset -6px 0 0 rgba(0,0,0,.07)}
#load .h::before{content:"";position:absolute;left:-5px;right:-5px;bottom:100%;height:20px;background:var(--r,#ff5a7a);clip-path:polygon(50% 0,100% 100%,0 100%)}
#load .h.t{width:26px;border-radius:3px}#load .h.t::before{display:none}
@keyframes rise{0%{transform:scaleY(0)}14%,82%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
#load .logo{position:relative;z-index:1;font:800 25px/1.15 Unbounded,sans-serif;text-align:center;letter-spacing:.02em;color:#1d2b44;text-shadow:0 2px 0 rgba(255,255,255,.7)}
#load .logo b{color:#ff5a7a;font-weight:800}
#load .lbox{position:relative;z-index:1;margin-top:22px;width:min(78vw,300px);background:rgba(255,255,255,.93);border-radius:20px;padding:14px 16px;box-shadow:0 8px 28px rgba(29,43,68,.16)}
#load .lbar{height:9px;border-radius:9px;background:rgba(29,43,68,.08);overflow:hidden}
#load .lbar i{display:block;height:100%;width:8%;border-radius:9px;transition:width .4s;background:linear-gradient(90deg,#ff7a8f,#ffc83d,#ff7a8f);background-size:200% 100%;animation:shine 1.4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
#load .lrow{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font:600 12px Inter,sans-serif;color:#5d6b82}#load .lrow b{color:#1d2b44;font:800 12px Unbounded,sans-serif}
#load .ltip{margin-top:8px;padding-top:8px;border-top:1px solid rgba(29,43,68,.1);font:500 12.5px/1.4 Inter,sans-serif;color:#5d6b82;min-height:3.6em;transition:opacity .3s}
html[data-night] #load{background:linear-gradient(#0f1838,#24305e 60%,#3a3f74)}
html[data-night] #load .sun{background:radial-gradient(circle,#fffbe8 0,#e9ecff 45%,rgba(200,210,255,0) 70%);width:64px;height:64px}
html[data-night] #load .cl{opacity:.12}html[data-night] #load .stars{opacity:1}
html[data-night] #load .hill{background:radial-gradient(ellipse at 50% 0,#3d6a4a,#27493a 60%);box-shadow:0 -6px 0 #4f7f5c inset}
html[data-night] #load .h{background:linear-gradient(90deg,transparent 22%,#ffd36b 22% 40%,transparent 40% 60%,#ffd36b 60% 78%,transparent 78%) 0 9px/100% 10px repeat-y,var(--w,#ffe1c7);filter:brightness(.85)}
html[data-night] #load .logo{color:#fff;text-shadow:0 0 18px rgba(255,90,122,.55)}
html[data-night] #load .lbox{background:rgba(22,30,58,.9);box-shadow:0 8px 28px rgba(0,0,0,.4)}
html[data-night] #load .lrow,html[data-night] #load .ltip{color:#a9b4d6}html[data-night] #load .lrow b{color:#fff}html[data-night] #load .lbar{background:rgba(255,255,255,.1)}html[data-night] #load .ltip{border-color:rgba(255,255,255,.12)}
/* тёмная тема (ночь): тёмно-синее стекло, светлый текст */
html[data-theme=dark]{--panel:rgba(22,30,58,.9);--line:rgba(255,255,255,.12);--goldt:#ffc83d;--text:#eef2ff;--muted:#a9b4d6;--soft:rgba(255,255,255,.08);--shadow:0 8px 28px rgba(0,0,0,.4)}
html[data-theme=dark] .title h1{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
html[data-theme=dark] .sheet{background:#18203f;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
html[data-theme=dark] .modal{background:rgba(5,8,20,.55)}
html[data-theme=dark] .modal.placing .sheet{background:rgba(24,32,63,.95)}
html[data-theme=dark] .sheet input,html[data-theme=dark] .sheet textarea,html[data-theme=dark] .sheet select{background:#0f1530;color:var(--text);border:1px solid var(--line)}
html[data-theme=dark] input::placeholder,html[data-theme=dark] textarea::placeholder{color:#7d88ad}
html[data-theme=dark] .opt.on{background:rgba(255,90,122,.16)}
html[data-theme=dark] #menuBtn{color:#1d2b44}html[data-theme=dark] #menuBtn.open{background:#fff;color:#18203f}
html[data-theme=dark] #toCity{background:var(--panel);color:var(--text)}
html[data-theme=dark] .hint{background:rgba(22,30,58,.75)}
html[data-theme=dark] .code{background:#0f1530}
html[data-theme=dark] .card{box-shadow:0 16px 50px rgba(0,0,0,.5)}
html[data-theme=dark] .chip{border:1px solid rgba(255,255,255,.08)}
html[data-theme=dark] .klad{border:2px solid var(--gold)}
html[data-theme=dark] .share,html[data-theme=dark] .klad.hot{color:#1d2b44}
html[data-theme=dark] .ic{filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
html[data-theme=dark],html[data-theme=old]{--toast:rgba(24,32,63,.97)}html[data-theme=old]{--text:#fff}
html[data-theme=old] .opt.on{background:rgba(255,210,63,.18);color:#fff}
html[data-theme=dark] .studio canvas{background:linear-gradient(#26305a,#1a2244)}
</style>

function openRoof(h) {
  // флаг 64×64, 31 цвет (идея жителей); старые 8×8 и 15×15 растягиваются
  const PAL = FLAG_PAL, N = 64, ABC = '0123456789abcdefghijklmnopqrstuv', f0 = fxMap[h.key] || {};
  const src = f0.rf64 && f0.rf64.length === N * N ? f0.rf64 : (f0.rf || ''), sn = Math.round(Math.sqrt(src.length));
  let px = src.length === N * N ? src.split('') : sn >= 8 ? Array.from({ length: N * N }, (_, i) => src[Math.floor(Math.floor(i / N) * sn / N) * sn + Math.floor((i % N) * sn / N)]) : '0'.repeat(N * N).split('');
  let col = 3, brush = 2, tool = 'pen'; const undo = [];
  sheet.innerHTML = `<h2>🎨 Флаг над домом</h2><p>Рисунок 64×64 — будет развеваться над твоим домом. Води пальцем по полю.</p>
    <div class="opts" id="rpal" style="gap:4px">${PAL.map((c, i) => `<button class="opt sw${i === col ? ' on' : ''}" data-col="${i}" type="button" style="width:28px;height:28px;background:${c || 'repeating-conic-gradient(#ccd3dd 0 25%,#fff 0 50%) 0 0/10px 10px'}"></button>`).join('')}</div>
    <div class="opts"><button class="opt" data-tool="pen" type="button">✏️ Кисть</button><button class="opt" data-tool="fill" type="button">🪣 Заливка</button>
      <button class="opt" data-b="1" type="button">•</button><button class="opt" data-b="2" type="button">●</button><button class="opt" data-b="4" type="button">⬤</button><button class="opt" id="rundo" type="button">↩️</button></div>
    <canvas id="rg" width="${N}" height="${N}" style="width:min(86vw,340px);aspect-ratio:1;margin:2px auto;display:block;image-rendering:pixelated;border-radius:10px;touch-action:none;background:repeating-conic-gradient(#e3e8ef 0 25%,#f6f8fb 0 50%) 0 0/${100 / 16}% ${100 / 16}%;box-shadow:0 0 0 1px var(--line)"></canvas>
    <button class="ghost" id="rpic" type="button">🖼 ИЗ КАРТИНКИ — пришли фото боту</button>
    <div class="btns"><button class="ghost" id="rclr" type="button">ОЧИСТИТЬ</button><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button><button id="rgo" type="button">ПОВЕСИТЬ</button></div>`;
  const cv = $('rg'), g = cv.getContext('2d');
  const put = i => { g.clearRect(i % N, Math.floor(i / N), 1, 1); const c = PAL[parseInt(px[i], 32)]; if (c) { g.fillStyle = c; g.fillRect(i % N, Math.floor(i / N), 1, 1); } };
  const draw = () => { g.clearRect(0, 0, N, N); for (let i = 0; i < N * N; i++) put(i); };
  const ui = () => { sheet.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x.dataset.tool === tool)); sheet.querySelectorAll('[data-b]').forEach(x => x.classList.toggle('on', +x.dataset.b === brush)); };
  draw(); ui();
  sheet.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { col = +b.dataset.col; sheet.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x === b)); });
  sheet.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { tool = b.dataset.tool; ui(); });
  sheet.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { brush = +b.dataset.b; tool = 'pen'; ui(); });
  const cell = e => { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * N), Math.floor((e.clientY - r.top) / r.height * N)]; };
  const dab = (x, y) => { const ch = ABC[col], o = Math.floor((brush - 1) / 2); for (let yy = y - o; yy < y - o + brush; yy++) for (let xx = x - o; xx < x - o + brush; xx++) { if (xx < 0 || yy < 0 || xx >= N || yy >= N) continue; const i = yy * N + xx; if (px[i] !== ch) { px[i] = ch; put(i); } } };
  const fill = (x, y) => { const from = px[y * N + x], to = ABC[col]; if (from === to) return; const st = [[x, y]]; while (st.length) { const [a, b] = st.pop(); if (a < 0 || b < 0 || a >= N || b >= N || px[b * N + a] !== from) continue; px[b * N + a] = to; st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]); } draw(); };
  let painting = false, last = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); undo.push(px.join('')); if (undo.length > 30) undo.shift(); const [x, y] = cell(e); if (tool === 'fill') return fill(x, y); painting = true; last = [x, y]; dab(x, y); };
  cv.onpointermove = e => { if (!painting) return; const [x, y] = cell(e), [lx, ly] = last, n = Math.max(Math.abs(x - lx), Math.abs(y - ly), 1); for (let k = 1; k <= n; k++) dab(Math.round(lx + (x - lx) * k / n), Math.round(ly + (y - ly) * k / n)); last = [x, y]; };
  cv.onpointerup = cv.onpointercancel = () => { painting = false; };
  $('rundo').onclick = () => { if (undo.length) { px = undo.pop().split(''); draw(); } };
  $('rpic').onclick = () => { const u = BOT_URL.split('?')[0] + '?start=flagpic'; if (TG && tg.openTelegramLink) { tg.openTelegramLink(u); } else window.open(u, '_blank'); };
  $('rclr').onclick = () => { undo.push(px.join('')); px = '0'.repeat(N * N).split(''); draw(); };
  $('rgo').onclick = () => sendTG({ t: 'roof', p64: px.join('') });
  modal.classList.add('show'); closeBtn();
}

  const deep = BOT_URL ? BOT_URL.replace(/\/$/, '') + '?start=klad' + KLAD.code : '';
  sheet.innerHTML = `<h2>💎 Ты нашёл клад!</h2><p>Твой код на сегодня:</p><div class="code">КЛАД-${KLAD.code}</div>
    <p>Приз — <b>дом по описанию бесплатно</b> (нейросеть построит твою идею в 3D). Код действует до конца дня (по МСК), призов на день ограниченно — кто первый.${kladLeft() != null ? ` <b>Осталось: ${kladLeft()} из ${kladState.limit}</b>.` : ''}</p>
    <div class="err" id="kerr"></div>
    <div class="btns"><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button>${TG ? '<button id="kgo" type="button">ЗАБРАТЬ ПРИЗ</button>' : deep ? `<a class="btn" href="${esc(deep)}">ЗАБРАТЬ В БОТЕ</a>` : ''}</div>
    ${!TG && !deep ? '<p>Напиши этот код боту города в Telegram.</p>' : ''}`;
  modal.classList.add('show'); closeBtn();
  if (TG) $('kgo').onclick = () => { try { sendTG({ t: 'klad', c: KLAD.code }); } catch (e) { $('kerr').textContent = 'Напиши боту: КЛАД-' + KLAD.code; } };
}

// ---------- окно ----------
const modal = $('modal'), sheet = $('sheet');
// режим «placing» снимаем, как только окно закрылось или в нём открыли что-то другое
// (снимаем класс только если он есть — иначе remove() снова меняет class и наблюдатель зацикливается → вкладка виснет)
const unplace = () => { if (modal.classList.contains('placing') && (!modal.classList.contains('show') || !sheet.querySelector('#pgo'))) modal.classList.remove('placing'); };
new MutationObserver(unplace).observe(modal, { attributes: true, attributeFilter: ['class'] });
new MutationObserver(unplace).observe(sheet, { childList: true });

modal.addEventListener('pointerdown', e => { if (e.target === modal) modal.classList.remove('show'); });
$('menuBtn').onclick = () => { const o = $('chips').classList.toggle('open'); $('menuBtn').classList.toggle('open', o); $('menuBtn').textContent = o ? '✕ ЗАКРЫТЬ' : '☰ МЕНЮ'; };
// ── иконки вместо эмодзи (icons/*.webp, нарезаны из одного листа)
const ICONS = [['🗳', 'vote'], ['💎', 'chest'], ['💬', 'chat'], ['🎡', 'park'], ['🏡', 'estate'], ['🏆', 'honor'], ['🏛', 'duma'], ['👤', 'myhome'], ['🔄', 'look'], ['🎁', 'gift'], ['🏙', 'city'], ['🏠', 'gethouse'], ['🪙', 'coin'], ['☀️', 'weather', 1], ['🌇', 'weather', 1], ['🌙', 'weather', 1]];
function iconize(el) {
  if (!el || el.classList.contains('opt') || el.querySelector('img.ic')) return;
  const n = el.firstChild; if (!n || n.nodeType !== 3) return;
  const t = n.nodeValue.trimStart(), m = ICONS.find(([e]) => t.startsWith(e)); if (!m || (m[2] && !el.classList.contains('chip'))) return;
  n.nodeValue = t.slice(m[0].length).replace(/^\uFE0F?\s*/, '');
  const i = new Image(); i.className = 'ic'; i.alt = ''; i.src = 'icons/' + m[1] + '.webp'; el.insertBefore(i, n);
}
const iconAll = root => root.querySelectorAll('.chip, button, a.btn, h2').forEach(iconize);
for (const r of [$('chips'), sheet, $('card'), document.body]) new MutationObserver(() => iconAll(r)).observe(r, { childList: true, subtree: r !== document.body, characterData: false });
iconAll(document.body);
if (!$('cshare').querySelector('img.ic')) $('cshare').insertAdjacentHTML('afterbegin', '<img class="ic" alt="" src="icons/share.webp">');
$('chips').addEventListener('click', e => { if (e.target.closest('.chip')) { $('chips').classList.remove('open'); $('menuBtn').classList.remove('open'); $('menuBtn').textContent = '☰ МЕНЮ'; } });
// «Осмотреть дом»: камера облетает дом по кругу, интерфейс прячется; любое касание — выход
let orbit = null;
function stopOrbit() { if (!orbit) return; cancelAnimationFrame(orbit.raf); orbit = null; document.body.classList.remove('orbiting'); }
function startOrbit(h) { stopOrbit(); if (!h) return;
  const top = city.houseTop ? city.houseTop(h) : 1; city.flyTo(h.x, h.z, Math.max(4.2, top * 2.6));
  document.body.classList.add('orbiting'); orbit = { raf: 0, t0: performance.now() };
  const step = () => { if (!orbit) return; city.ctl.taz += .0055; orbit.raf = requestAnimationFrame(step); }; step();
  setTimeout(() => addEventListener('pointerdown', stopOrbit, { once: true }), 300); }
// кнопка «В город», когда камера улетела в Посёлок Усадеб (он за озером, далеко от центра)
$('toCity').onclick = () => { city.flyTo(0, 0, 34); $('toCity').classList.remove('show'); };
setInterval(() => { const c = city.ctl, far = c && (city.estateCenter && Math.hypot(c.tx - city.estateCenter.x, c.tz - city.estateCenter.z) < 16); $('toCity').classList.toggle('show', !!far); }, 700);
const closeBtn = () => { $('mclose').onclick = () => modal.classList.remove('show'); };

// ---------- выборы ----------
function renderElection() {
  const E = election; $('chips').innerHTML = ''; if (!E || !E.stage) return;
  const chip = document.createElement('button'); chip.className = 'chip'; chip.textContent = E.chip || '🗳 ВЫБОРЫ МЭРА'; $('chips').appendChild(chip);
  chip.onclick = () => {
    const tot = (E.candidates || []).reduce((n, c) => n + (c.votes || 0), 0), open2 = E.stage === 2;
    const cands = (E.candidates || []).map((c, i) => { const pc = tot ? Math.round((c.votes || 0) / tot * 100) : 0;
      return `<div class="cand"><b>${i + 1}</b><div style="flex:1;min-width:0"><div class="n">@${esc(norm(c.nick))}${E.winner && norm(E.winner) === norm(c.nick) ? ' 👑' : ''}</div><div class="p">${(c.promise || '').length > 170 ? `${esc(c.promise.slice(0, 160))}… <button class="more" type="button" data-full="${esc(c.promise)}" style="background:none;border:0;padding:0;color:var(--goldt);font:700 13px Inter,sans-serif;cursor:pointer">читать дальше</button>` : esc(c.promise || '')}</div>`
        + (c.votes != null ? `<div class="vbar"><i style="width:${pc}%"></i></div><div class="p">🗳 ${c.votes} · ${pc}%</div>` : '')
        + `</div><div style="display:flex;flex-direction:column;gap:6px;align-self:center">${city.byKey.get(norm(c.nick)) ? `<button class="vbtn ghost" type="button" data-home="${esc(norm(c.nick))}">🏠 ДОМ</button>` : ''}${open2 && c.vote ? `<a class="btn vbtn tglink" href="${esc(c.vote)}" target="_blank" rel="noopener">ЗА</a>` : ''}</div></div>`; }).join('')
      || (open2 ? '<p>Кандидатов пока нет — стань первым! 🙋</p>' : '');
    sheet.innerHTML = `<h2>${esc(E.title || 'Выборы мэра')}</h2><p>${esc(E.text || '')}</p>${(E.deputies || []).length ? `<p>🎖 Заместители мэра: <b>${E.deputies.map(d => '@' + esc(d)).join(', ')}</b></p>` : ''}${cands}${E.until ? `<p>⏳ До: <b>${esc(E.until)}</b></p>` : ''}
      <div class="btns">${open2 && E.apply ? `<a class="btn tglink" href="${esc(E.apply)}" target="_blank" rel="noopener">🙋 СТАТЬ КАНДИДАТОМ</a>` : ''}${E.link && !open2 ? `<a class="btn" href="${esc(E.link)}" target="_blank" rel="noopener">${esc(E.button || 'УЧАСТВОВАТЬ')}</a>` : ''}<button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button></div>`;
    sheet.querySelectorAll('.tglink').forEach(a => a.onclick = e => { if (TG && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(a.href); } });
    sheet.querySelectorAll('.more').forEach(b => b.onclick = () => { b.parentElement.textContent = b.dataset.full; });
    sheet.querySelectorAll('[data-home]').forEach(b => b.onclick = () => { const h = city.byKey.get(b.dataset.home); if (h) { modal.classList.remove('show'); focus(h); } });
    modal.classList.add('show'); closeBtn();
  };
}

// ---------- «Получить дом» / мини-приложение ----------
if (/tgWebApp/.test(location.hash + location.search) || window.TelegramWebviewProxy) await new Promise(res => { const sc = document.createElement('script'); sc.src = 'https://telegram.org/js/telegram-web-app.js'; sc.onload = sc.onerror = res; document.head.appendChild(sc); setTimeout(res, 5000); });
const tg = window.Telegram && window.Telegram.WebApp;
const TG = !!(tg && tg.platform && tg.platform !== 'unknown');
const GIFT = new URLSearchParams(location.search).get('gift') === '1';
const ME = norm(new URLSearchParams(location.search).get('me') || '');
const WALL_C = ['#ffcf4a', '#f28b82', '#a7d36f', '#7cc8ff', '#c9a0e8', '#f7a8d0', '#86d4c8', '#9aa3b5'];
const ROOF_C = ['#d1404f', '#3d5a99', '#6b3fa0', '#2f7a6b', '#b8562f', '#374070'];
const SHAPE_N = { house: 'Домик', tower: 'Башня', castle: 'Замок', skyscraper: 'Небоскрёб', dome: 'Купол', clocktower: 'Часы' };
const EMB = { none: '✖', sun: '☀️', moon: '🌙', star: '⭐', heart: '❤️', clock: '🕐', crown: '👑', flame: '🔥', leaf: '🍃', lightning: '⚡', diamond: '💎', snake: '🐍' };
const LIGHT_N = { warm: '🟡', cool: '🔵', pink: '🩷', green: '🟢' };
$('cta').onclick = () => {
  if (TG) return openStudio();
  if (BOT_URL) { location.href = BOT_URL; return; }
  sheet.innerHTML = `<h2>Получить дом</h2><p>1 подписка = 1 дом с твоим ником. Подпишись на <a style="color:var(--goldt)" href="${TIKTOK_URL}" target="_blank" rel="noopener">${TIKTOK_NICK}</a> — новые жители заселяются ${CHECK_TIME}.</p><div class="btns"><a class="btn" href="${TIKTOK_URL}" target="_blank" rel="noopener">ПОДПИСАТЬСЯ</a><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button></div>`;
  modal.classList.add('show'); closeBtn();
};
let studio = { tab: GIFT ? 'ai' : 'free', preset: 0, r: { ...CityHouse.PRESETS[0].r } }, preview = null;
function openStudio() {
  if (!ME) {
    sheet.innerHTML = TG ? `<h2>Мой дом</h2><p>Город открыт без твоего ника 🤔 Нажми кнопку — бот пришлёт правильную кнопку «🏙 Открыть город» с твоим домом и подарками.</p><p>Если ник ещё не привязан — бот подскажет, как это сделать.</p><div class="btns"><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button><button id="whoami" type="button">🔄 МОЯ КНОПКА</button></div>`
      : `<h2>Мой дом</h2><p>Сначала привяжи свой ник TikTok в боте — кнопка «🏠 Мой дом».</p><button class="ghost" id="mclose">ЗАКРЫТЬ</button>`;
    modal.classList.add('show'); closeBtn(); if ($('whoami')) $('whoami').onclick = () => sendTG({ t: 'me' }); return; }
  const mine = city.byKey.get(ME); if (mine && mine.recipe) studio.r = { ...mine.recipe };
  renderStudio(); modal.classList.add('show');
}
const DECOR_N = { garland: '🎄 Гирлянда', tree: '🌲 Ёлка', car: '🚗 Машина', pet: '🐶 Питомец' };
function renderStudio() {
  const S = studio, R = S.r, opts = (key, list, fmt) => list.map(v => `<button class="opt ${R[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${fmt(v)}</button>`).join('');
  const sw = (key, list) => list.map(v => `<button class="opt sw ${R[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}" style="background:${v}"></button>`).join('');
  const dec = new Set(R.decor || []);
  const go = S.tab === 'free' ? 'ВЫБРАТЬ' : S.tab === 'ai' ? (GIFT ? 'ПОСТРОИТЬ БЕСПЛАТНО 🎁' : `ПОСТРОИТЬ · ${AI_PRICE} ⭐ / 🎁`) : (CUSTOM_PRICE ? 'ОПЛАТИТЬ ' + CUSTOM_PRICE + ' ⭐' : 'СОХРАНИТЬ');
  sheet.innerHTML = `<div class="studio"><h2>Мой дом · @${esc(ME)}</h2>
    ${S.tab === 'ai' ? '' : '<canvas id="prev" style="width:200px;height:200px"></canvas>'}
    <div class="tabs"><button data-tab="free" class="${S.tab === 'free' ? 'on' : ''}">5 ГОТОВЫХ</button><button data-tab="pro" class="${S.tab === 'pro' ? 'on' : ''}">КОНСТРУКТОР</button><button data-tab="ai" class="${S.tab === 'ai' ? 'on' : ''}">✨ ПО ОПИСАНИЮ</button></div>
    ${S.tab === 'free' ? `<div class="pre">${CityHouse.PRESETS.map((p, i) => `<button class="opt ${S.preset === i ? 'on' : ''}" data-pre="${i}">${esc(p.name)}</button>`).join('')}</div>` : S.tab === 'ai' ? `
    <p>Опиши дом мечты — <b>нейросеть соберёт его в 3D</b> из деталей: ракета, пончик, замок, дом-кот… Перед тем как поставить в город, дом проверит мэрия. Если не получится — звёзды вернём.</p>
    <textarea id="aitext" maxlength="300" placeholder="Например: дом-ракета с иллюминаторами и огнём из сопел">${esc(S.ai || '')}</textarea>` : `
    <div class="srow"><span>Форма</span><div class="opts">${opts('shape', CityHouse.SHAPES, v => SHAPE_N[v])}</div></div>
    <div class="srow"><span>Стены</span><div class="opts">${sw('wall', WALL_C)}</div></div>
    <div class="srow"><span>Крыша</span><div class="opts">${sw('roof', ROOF_C)}</div></div>
    <div class="srow"><span>Этажи</span><div class="opts">${opts('floors', [1, 2, 3, 4, 5, 6], v => v)}</div></div>
    <div class="srow"><span>Знак на фасаде</span><div class="opts">${opts('emblem', CityHouse.EMBLEMS, v => EMB[v])}</div></div>
    <div class="srow"><span>Свет в окнах</span><div class="opts">${opts('lights', CityHouse.LIGHTS, v => LIGHT_N[v])}</div></div>
    <div class="srow"><span>Декор · 📢 бонус подписчикам ТГ-канала</span><div class="opts">${Object.entries(DECOR_N).map(([k, n]) => `<button class="opt ${dec.has(k) ? 'on' : ''}" data-dec="${k}">${n}</button>`).join('')}</div></div>`}
    <div class="err" id="serr"></div>
    <div class="btns"><button class="ghost" id="mclose" type="button">ЗАКРЫТЬ</button><button id="sgo" type="button">${go}</button></div></div>`;
  sheet.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { if (S.tab === 'ai') S.ai = ($('aitext') || {}).value || S.ai; S.tab = b.dataset.tab; if (S.tab === 'free') S.r = { ...CityHouse.PRESETS[S.preset].r }; renderStudio(); });
  sheet.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { S.preset = +b.dataset.pre; S.r = { ...CityHouse.PRESETS[S.preset].r }; renderStudio(); });
  sheet.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; R[k] = k === 'floors' ? +b.dataset.v : b.dataset.v; renderStudio(); });
  sheet.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { const d = new Set(R.decor || []); d.has(b.dataset.dec) ? d.delete(b.dataset.dec) : d.add(b.dataset.dec); R.decor = [...d]; renderStudio(); });
  closeBtn();
  $('sgo').onclick = () => {
    let data;
    if (S.tab === 'free') data = { t: 'preset', i: S.preset };
    else if (S.tab === 'ai') { const d = ($('aitext').value || '').trim(); if (d.length < 5) { $('serr').textContent = 'Опиши дом хотя бы парой слов 🙂'; return; } data = { t: 'ai', d }; }
    else data = { t: 'custom', r: { ...CityHouse.normRecipe(R), decor: R.decor || [] } };
    const mineH = city.byKey.get(ME), special = mineH && mineH.recipe && Array.isArray(mineH.recipe.parts) && mineH.recipe.parts.length;
    if (S.tab !== 'ai' && special && !S.confirmed) { const msgC = 'У тебя особый дом (сделан по описанию). Если выбрать этот — особый дом пропадёт. Точно заменить?';
      const go = ok => { if (ok) { S.confirmed = true; $('sgo').click(); } };
      try { tg.showConfirm(msgC, go); } catch (e) { go(confirm(msgC)); } return; }
    S.confirmed = false;
    try { sendTG(data); } catch (e) { $('serr').textContent = 'Открой город кнопкой «🏙 Открыть город» внизу чата с ботом — тогда выбор отправится.'; }
  };
  if (preview) preview.alive = false; preview = null;
  if ($('prev')) { preview = new HousePreview($('prev')); preview.set(R); }
}
if (TG) { try { tg.ready(); tg.expand(); } catch (e) {} $('cta').textContent = '🎨 МОЙ ДОМ'; }

loadCity().then(() => {
  const k = norm(decodeURIComponent(location.hash.slice(1))) || (TG ? ME : '');
  const h = k && city.byKey.get(k); if (h) setTimeout(() => focus(h), 400);
});
</script>
</body>
</html>

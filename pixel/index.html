<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Пиксель-баттл</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0e0f1a; --panel:rgba(22,24,40,.94); --line:#2c2f4a; --text:#f2f3ff; --dim:#9aa0c3; --acc:#ffd23f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  #view { position:fixed; inset:0; cursor:crosshair; background:
      radial-gradient(circle at 50% 40%, #1a1c33 0, var(--bg) 70%); }
  #wrap { position:absolute; left:0; top:0; transform-origin:0 0; }
  #cv { display:block; image-rendering:pixelated; image-rendering:crisp-edges; box-shadow:0 0 0 1px #000, 0 20px 80px rgba(0,0,0,.6); }
  #sel { position:absolute; left:0; top:0; width:1px; height:1px; outline:.12px solid #000; box-shadow:0 0 0 .12px #fff; pointer-events:none; display:none; }
  .top { position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; pointer-events:none; }
  .chip { pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-weight:600; font-size:13px; white-space:nowrap; }
  .chip b { color:var(--acc); }
  .grow { flex:1; }
  button.chip { color:var(--text); cursor:pointer; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
  .pal { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; max-width:520px; margin:0 auto 10px; }
  .pal button { aspect-ratio:1; border-radius:9px; border:2px solid rgba(255,255,255,.12); cursor:pointer; padding:0; }
  .pal button.on { border-color:var(--acc); transform:scale(1.08); box-shadow:0 0 0 2px #000 inset; }
  .row { display:flex; gap:8px; max-width:520px; margin:0 auto; align-items:center; }
  #coord { color:var(--dim); font-size:13px; min-width:70px; }
  #put { flex:1; height:46px; border:0; border-radius:12px; background:var(--acc); color:#1a1300; font-weight:800; font-size:16px; letter-spacing:.3px; cursor:pointer; }
  #put:disabled { background:#3a3d5c; color:var(--dim); cursor:default; }
  #toast { position:fixed; left:50%; top:calc(56px + env(safe-area-inset-top)); transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); padding:8px 14px; border-radius:12px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88vw; text-align:center; }
  #topList { position:fixed; right:12px; top:calc(52px + env(safe-area-inset-top)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; min-width:190px; display:none; }
  #topList h3 { margin:0 0 6px; font-size:14px; }
  #topList div { display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:2px 0; color:var(--dim); }
  #topList div b { color:var(--text); font-weight:600; }
  #help { position:fixed; inset:0; background:rgba(8,9,16,.8); display:flex; align-items:center; justify-content:center; padding:16px; }
  #help .card { background:#171a2d; border:1px solid var(--line); border-radius:18px; padding:20px; max-width:360px; }
  #help h2 { margin:0 0 8px; } #help p { color:var(--dim); margin:6px 0; }
  #help button { margin-top:12px; width:100%; height:44px; border:0; border-radius:12px; background:var(--acc); font-weight:800; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<div id="view"><div id="wrap"><canvas id="cv"></canvas><div id="sel"></div></div></div>

<div class="top">
  <span class="chip">🟢 <b id="online">0</b> онлайн</span>
  <span class="chip">🎨 <b id="meName">…</b></span>
  <span class="grow"></span>
  <button class="chip" id="topBtn" type="button">🏆 Топ</button>
</div>
<div id="topList"></div>
<div id="toast"></div>

<div class="bar">
  <div class="pal" id="pal"></div>
  <div class="row"><span id="coord">—</span><button id="put" type="button" disabled>ВЫБЕРИ КЛЕТКУ</button></div>
</div>

<div id="help"><div class="card">
  <h2>🎨 Пиксель-баттл</h2>
  <p>Общий холст для всех. Ставь 1 пиксель раз в <b id="cdTxt">30</b> секунд — вместе рисуем картинки, защищаем свои и перекрашиваем чужие.</p>
  <p>👆 Тап — выбрать клетку · два пальца / колесо — приближение · тяни — двигать.</p>
  <input id="nameIn" maxlength="16" placeholder="Твой ник (как подписать пиксели)" style="width:100%;height:44px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:#0e0f1a;color:var(--text);padding:0 12px;font-size:15px">
  <button type="button" id="go">ПОГНАЛИ</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); } catch (e) {} }
// Сервер отдаёт страницу сам (локально) — или страница лежит на хостинге, а адрес сервера берём из api.json (туннель меняется)
const SELF = location.pathname === '/' || location.port === '8090';
let BASE = SELF ? location.origin : '', fails = 0;
async function resolveBase() { if (SELF) return BASE;
  const j = await Promise.all(['../api.json', 'https://raw.githubusercontent.com/gaga228ir-crypto/gorod-podpischikovbn/main/api.json']
    .map(u => fetch(u + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)));
  const b = j.filter(x => x && x.url).sort((a, c) => (c.ts || 0) - (a.ts || 0))[0]; if (b) BASE = b.url.replace(/\/api$/, '/px'); return BASE; }
const myName = () => { try { return localStorage.getItem('pxName') || ''; } catch (e) { return ''; } };
let SIZE = 100, PAL = [], CD = 30, board, color = 3, sel = null, waitUntil = 0, ws, scale = 6, ox = 0, oy = 0;
const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('wrap'), view = $('view');

function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = 0, 2500); }
function apply() { wrap.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`; }
function fit() { const w = innerWidth, h = innerHeight - document.querySelector('.bar').offsetHeight - 70;
  scale = Math.max(1, Math.min(w * .94, h * .94) / SIZE); ox = (w - SIZE * scale) / 2; oy = 60 + (h - SIZE * scale) / 2; apply(); }
function draw(x, y, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, 1, 1); }
function drawAll() { const img = ctx.createImageData(SIZE, SIZE);
  const rgb = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  for (let i = 0; i < board.length; i++) { const p = rgb[board[i]] || rgb[0]; img.data.set([p[0], p[1], p[2], 255], i * 4); }
  ctx.putImageData(img, 0, 0); }
async function loadBoard() { board = new Uint8Array(await (await fetch(BASE + '/board', { cache: 'no-store' })).arrayBuffer()); drawAll(); }

function buildPalette() { const el = $('pal'); el.innerHTML = '';
  PAL.forEach((c, i) => { const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.className = i === color ? 'on' : '';
    b.onclick = () => { color = i; [...el.children].forEach((x, j) => x.className = j === i ? 'on' : ''); tick(); }; el.appendChild(b); }); }

function setSel(x, y) { sel = { x, y }; const s = $('sel'); s.style.display = 'block'; s.style.transform = `translate(${x}px,${y}px)`; $('coord').textContent = `x ${x} · y ${y}`; tick();
  fetch(`${BASE}/who?x=${x}&y=${y}`).then(r => r.json()).then(j => { if (j.name && sel && sel.x === x && sel.y === y) $('coord').textContent = `x ${x} · y ${y} · ${j.name}`; }).catch(() => {}); }

function tick() { const left = Math.ceil((waitUntil - Date.now()) / 1000), b = $('put');
  if (left > 0) { b.disabled = true; b.textContent = `⏳ ${left} С`; }
  else if (!sel) { b.disabled = true; b.textContent = 'ВЫБЕРИ КЛЕТКУ'; }
  else if (!ws || ws.readyState !== 1) { b.disabled = true; b.textContent = 'ПОДКЛЮЧАЮСЬ…'; }
  else { b.disabled = false; b.textContent = 'ПОСТАВИТЬ ПИКСЕЛЬ'; b.style.background = ''; } }
setInterval(tick, 250);

$('put').onclick = () => { if (!sel || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ t: 'place', x: sel.x, y: sel.y, c: color })); waitUntil = Date.now() + CD * 1000;
  board[sel.y * SIZE + sel.x] = color; draw(sel.x, sel.y, color); try { tg && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} tick(); };

function anonId() { try { let a = localStorage.getItem('pxAnon'); if (!a) { a = crypto.getRandomValues(new Uint32Array(4)).join('-'); localStorage.setItem('pxAnon', a); } return a; } catch (e) { return ''; } }
function connect() {
  ws = new WebSocket(BASE.replace(/^http/, 'ws') + '/ws');
  ws.onopen = () => { fails = 0; ws.send(JSON.stringify({ t: 'hello', initData: tg ? tg.initData : '', anon: anonId(), name: myName() })); loadBoard(); tick(); };
  ws.onmessage = e => { const d = JSON.parse(e.data);
    if (d.t === 'px') { board[d.y * SIZE + d.x] = d.c; draw(d.x, d.y, d.c); }
    else if (d.t === 'online') $('online').textContent = d.n;
    else if (d.t === 'me' && d.name) { $('meName').textContent = d.name; waitUntil = Date.now() + d.wait * 1000; tick(); }
    else if (d.t === 'me' || d.t === 'wait') { waitUntil = Date.now() + d.wait * 1000; if (d.t === 'wait' && d.wait < CD) toast('Подожди ещё ' + Math.ceil(d.wait) + ' с'); tick(); }
    else if (d.t === 'reload') loadBoard(); };
  ws.onclose = async () => { tick(); if (++fails % 3 === 0) await resolveBase(); setTimeout(connect, 2000); };
}

// --- перемещение и масштаб (мышь + пальцы) ---
const pts = new Map(); let moved = 0, pinch0 = null;
view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: scale, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, ox, oy }; } });
view.addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy); ox += dx; oy += dy; apply(); }
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const k = Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d; moved = 99;
    zoomAt(pinch0.mx, pinch0.my, Math.min(60, Math.max(1, pinch0.s * k)), pinch0); } });
function endPtr(e) { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null;
  if (e.type === 'pointerup' && pts.size === 0 && moved < 8) { const x = Math.floor((e.clientX - ox) / scale), y = Math.floor((e.clientY - oy) / scale);
    if (x >= 0 && y >= 0 && x < SIZE && y < SIZE) { setSel(x, y); if (scale < 8) zoomAt(e.clientX, e.clientY, 10); } } }
view.addEventListener('pointerup', endPtr); view.addEventListener('pointercancel', endPtr);
view.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.min(60, Math.max(1, scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)))); }, { passive: false });
function zoomAt(mx, my, ns, from) { const s0 = from ? from.s : scale, ox0 = from ? from.ox : ox, oy0 = from ? from.oy : oy;
  const wx = (mx - ox0) / s0, wy = (my - oy0) / s0; scale = ns; ox = mx - wx * ns; oy = my - wy * ns; apply(); }

$('topBtn').onclick = async () => { const el = $('topList'); if (el.style.display === 'block') { el.style.display = 'none'; return; }
  const t = await (await fetch(BASE + '/top')).json().catch(() => []);
  el.innerHTML = '<h3>🏆 Больше всех пикселей</h3>' + (t.length ? t.map((r, i) => `<div><b>${i + 1}. ${r.name.replace(/[<>&]/g, '')}</b><span>${r.n}</span></div>`).join('') : '<div>пока пусто — будь первым</div>');
  el.style.display = 'block'; };
if (tg && tg.initData) $('nameIn').style.display = 'none'; else $('nameIn').value = myName();
$('go').onclick = () => { const n = $('nameIn').value.trim(); if (!(tg && tg.initData) && n.length < 2) { $('nameIn').focus(); $('nameIn').placeholder = 'Напиши ник — от 2 букв'; return; }
  $('help').style.display = 'none'; try { localStorage.setItem('pxHelp', 1); if (n) localStorage.setItem('pxName', n); } catch (e) {}
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'hello', initData: tg ? tg.initData : '', anon: anonId(), name: myName() })); };
try { if (localStorage.getItem('pxHelp') && (myName() || (tg && tg.initData))) $('help').style.display = 'none'; } catch (e) {}

(async () => { await resolveBase(); let info;
  for (;;) { try { info = await (await fetch(BASE + '/info', { cache: 'no-store' })).json(); break; } catch (e) { toast('Сервер просыпается… пробую ещё'); await new Promise(r => setTimeout(r, 4000)); await resolveBase(); } } SIZE = info.size; PAL = info.palette; CD = info.cooldown; $('cdTxt').textContent = CD;
  cv.width = cv.height = SIZE; $('cv').style.width = $('cv').style.height = SIZE + 'px'; buildPalette(); fit(); await loadBoard(); connect(); })();
addEventListener('resize', fit);
</script>
</body>
</html>

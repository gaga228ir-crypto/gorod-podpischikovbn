<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b24">
<title>Пиксель-баттл</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#070b24; --bg2:#0d1236; --panel:rgba(16,12,46,.82); --line:rgba(140,120,255,.22); --text:#fff; --dim:#a9a3d9;
          --pink:#ff3d7f; --gold:#ffd23f; --cyan:#5ef2ff; --violet:#8b5cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:500 15px/1.35 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  button { font:inherit; color:inherit; }
  .brand { font-family:Unbounded,Inter,sans-serif; font-weight:800; letter-spacing:.3px; }

  /* фон: мягкое свечение + точечная сетка */
  #view { position:fixed; inset:0; cursor:crosshair; overflow:hidden;
    background: radial-gradient(1200px 700px at 15% -10%, rgba(255,61,127,.18), transparent 60%),
                radial-gradient(1000px 700px at 110% 110%, rgba(94,242,255,.14), transparent 60%),
                radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.4px) 0 0/22px 22px, var(--bg); }
  #wrap { position:absolute; left:0; top:0; transform-origin:0 0; }
  #cv { display:block; image-rendering:pixelated; image-rendering:crisp-edges; border-radius:.6px;
    box-shadow:0 0 0 .6px rgba(255,255,255,.35), 0 0 6px 1px rgba(255,61,127,.55), 0 0 18px 4px rgba(139,92,255,.35); }
  #grid { position:fixed; inset:0; pointer-events:none; }
  #sel { position:absolute; left:0; top:0; width:1px; height:1px; pointer-events:none; display:none; }
  #sel i { position:absolute; inset:0; opacity:.85; }
  #sel b { position:absolute; inset:-.14px; border:.12px solid #fff; box-shadow:0 0 0 .08px #000, 0 0 .5px .1px var(--gold); animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { inset:-.24px; border-color:var(--gold); } }

  /* верх */
  .top { position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; pointer-events:none; z-index:3; }
  .logo { pointer-events:auto; display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:14px; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .logo .ic { width:28px; height:28px; border-radius:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:3px; background:#120d33; }
  .logo .ic i { border-radius:2px; }
  .logo .t { font-size:13px; line-height:1; background:linear-gradient(90deg,var(--pink),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo .t small { display:block; font-family:Inter,sans-serif; font-weight:600; font-size:10.5px; color:var(--dim); -webkit-text-fill-color:var(--dim); margin-top:3px; letter-spacing:.2px; }
  .chip { pointer-events:auto; display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-weight:600; font-size:13px; white-space:nowrap; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .chip b { color:var(--gold); }
  .dot { width:8px; height:8px; border-radius:50%; background:#3dff8e; box-shadow:0 0 0 0 rgba(61,255,142,.6); animation:live 1.8s infinite; }
  @keyframes live { 70% { box-shadow:0 0 0 7px rgba(61,255,142,0); } 100% { box-shadow:0 0 0 0 rgba(61,255,142,0); } }
  .grow { flex:1; }
  button.chip { cursor:pointer; } button.chip:hover { border-color:rgba(255,210,63,.55); }
  #meChip { max-width:34vw; overflow:hidden; text-overflow:ellipsis; }

  /* зум */
  .zoom { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:3; }
  .zoom button { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--panel); font-size:18px; font-weight:700; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .zoom button:hover { border-color:var(--cyan); }

  /* низ */
  .bar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); width:min(560px, calc(100vw - 20px)); padding:12px; border-radius:22px;
    background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 20px 60px rgba(0,0,0,.45); z-index:3; }
  .pal { display:grid; grid-template-columns:repeat(8,1fr); gap:7px; margin-bottom:10px; }
  @media (min-width:700px) { .pal { grid-template-columns:repeat(16,1fr); gap:6px; } }
  .pal button { aspect-ratio:1; border-radius:10px; border:0; cursor:pointer; padding:0; position:relative; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.18); transition:transform .12s; }
  .pal button:hover { transform:translateY(-2px); }
  .pal button.on { transform:translateY(-3px) scale(1.06); box-shadow:0 0 0 2px var(--bg2), 0 0 0 4px var(--gold), 0 6px 16px rgba(255,210,63,.35); }
  .row { display:flex; gap:10px; align-items:center; }
  .info { min-width:0; flex:0 1 auto; font-size:12.5px; color:var(--dim); line-height:1.25; }
  .info b { display:block; color:var(--text); font-size:13.5px; }
  .info span { display:block; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #put { position:relative; overflow:hidden; flex:1; height:50px; border:0; border-radius:15px; cursor:pointer;
    background:linear-gradient(90deg,var(--pink),#ff7a59 55%,var(--gold)); color:#1a0f2e; font-family:Unbounded,Inter,sans-serif; font-weight:800; font-size:14px; letter-spacing:.4px;
    box-shadow:0 8px 24px rgba(255,61,127,.35); transition:transform .1s, box-shadow .2s; }
  #put:active:not(:disabled) { transform:scale(.98); }
  #put:disabled { background:#211b4d; color:var(--dim); box-shadow:none; cursor:default; }
  #put .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,rgba(255,61,127,.35),rgba(255,210,63,.35)); width:0; transition:width .25s linear; }
  #put .lbl { position:relative; }
  #put .sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:8px; box-shadow:0 0 0 2px rgba(26,15,46,.6); }

  /* всплывашки, топ, приветствие */
  #toast { position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top)); transform:translate(-50%,-8px); background:rgba(20,14,58,.96); border:1px solid rgba(255,210,63,.5); padding:9px 16px; border-radius:14px; font-size:13.5px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; max-width:88vw; text-align:center; z-index:5; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #topList { position:fixed; right:12px; top:calc(58px + env(safe-area-inset-top)); width:min(280px, calc(100vw - 24px)); background:rgba(16,12,46,.95); border:1px solid var(--line); border-radius:18px; padding:14px; display:none; z-index:4; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #topList h3 { margin:0 0 10px; font-size:13px; }
  #topList .r { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:10px; font-size:13.5px; }
  #topList .r:nth-child(odd) { background:rgba(255,255,255,.04); }
  #topList .r .m { width:22px; text-align:center; }
  #topList .r b { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #topList .r span { color:var(--gold); font-weight:700; }
  #help { position:fixed; inset:0; background:rgba(5,6,20,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:6; }
  #help .card { position:relative; background:linear-gradient(160deg,#1a1450,#0f0c30); border:1px solid var(--line); border-radius:24px; padding:22px; max-width:380px; width:100%; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(139,92,255,.2); }
  .art { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; width:150px; margin:0 auto 14px; }
  .art i { aspect-ratio:1; border-radius:2px; animation:pop .5s backwards; }
  @keyframes pop { from { transform:scale(0); } }
  #help h2 { margin:0 0 6px; text-align:center; font-size:22px; background:linear-gradient(90deg,var(--pink),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #help .sub { text-align:center; color:var(--dim); margin:0 0 14px; font-size:14px; }
  .steps { display:grid; gap:8px; margin-bottom:14px; }
  .steps div { display:flex; gap:10px; align-items:center; font-size:13.5px; color:#ddd8ff; background:rgba(255,255,255,.04); border-radius:12px; padding:9px 11px; }
  .steps div em { font-style:normal; font-size:18px; }
  #nameIn { width:100%; height:48px; border-radius:14px; border:1px solid var(--line); background:#0b0826; color:var(--text); padding:0 14px; font:600 15px Inter,sans-serif; outline:none; }
  #nameIn:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,61,127,.25); }
  #go { margin-top:10px; width:100%; height:50px; border:0; border-radius:15px; background:linear-gradient(90deg,var(--pink),var(--gold)); color:#1a0f2e; font-family:Unbounded,Inter,sans-serif; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 10px 30px rgba(255,61,127,.35); }
  .ping { position:absolute; width:1px; height:1px; pointer-events:none; border:.15px solid #fff; border-radius:.1px; animation:ping .6s ease-out forwards; }
  @keyframes ping { to { transform:scale(4); opacity:0; } }
  @media (max-width:420px) { .logo .t { font-size:11.5px; } .logo .t small { display:none; } #put { font-size:12.5px; } }
</style>
</head>
<body>
<div id="view"><div id="wrap"><canvas id="cv"></canvas><div id="sel"><i></i><b></b></div></div></div>
<canvas id="grid"></canvas>

<div class="top">
  <div class="logo"><div class="ic" id="logoIc"></div><div class="t brand">ПИКСЕЛЬ·БАТТЛ<small>общий холст для всех</small></div></div>
  <span class="grow"></span>
  <span class="chip"><span class="dot"></span><b id="online">0</b></span>
  <button class="chip" id="meChip" type="button" title="Сменить ник">🎨 <b id="meName">…</b></button>
  <button class="chip" id="topBtn" type="button">🏆</button>
</div>
<div class="zoom"><button type="button" id="zIn" aria-label="Приблизить">+</button><button type="button" id="zOut" aria-label="Отдалить">−</button><button type="button" id="zFit" aria-label="Весь холст">⤢</button></div>
<div id="topList"></div>
<div id="toast"></div>

<div class="bar">
  <div class="pal" id="pal"></div>
  <div class="row"><div class="info" id="coord"><b>Выбери клетку</b><span>тапни по холсту</span></div>
    <button id="put" type="button" disabled><span class="fill" id="fill"></span><span class="lbl" id="putL">ВЫБЕРИ КЛЕТКУ</span></button></div>
</div>

<div id="help"><div class="card">
  <div class="art" id="art"></div>
  <h2 class="brand">ПИКСЕЛЬ·БАТТЛ</h2>
  <p class="sub">Один холст на всех. Рисуйте вместе, защищайте свои картинки, перекрашивайте чужие.</p>
  <div class="steps">
    <div><em>👆</em>Тапни клетку и выбери цвет</div>
    <div><em>⏱</em>1 пиксель раз в <b id="cdTxt">&nbsp;30&nbsp;</b> секунд</div>
    <div><em>🔍</em>Два пальца или колесо — приблизить, тяни — двигать</div>
  </div>
  <input id="nameIn" maxlength="16" placeholder="Твой ник" autocomplete="off">
  <button type="button" id="go">ПОГНАЛИ</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); tg.setHeaderColor('#070b24'); tg.setBackgroundColor('#070b24'); } catch (e) {} }
// Сервер отдаёт страницу сам (локально) — или страница лежит на хостинге, а адрес сервера берём из api.json (туннель меняется)
const SELF = location.pathname === '/' || location.port === '8090';
let BASE = SELF ? location.origin : '', fails = 0;
async function resolveBase() { if (SELF) return BASE;
  const j = await Promise.all(['../api.json', 'https://raw.githubusercontent.com/gaga228ir-crypto/gorod-podpischikovbn/main/api.json']
    .map(u => fetch(u + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)));
  const b = j.filter(x => x && x.url).sort((a, c) => (c.ts || 0) - (a.ts || 0))[0]; if (b) BASE = b.url.replace(/\/api$/, '/px'); return BASE; }
const myName = () => { try { return localStorage.getItem('pxName') || ''; } catch (e) { return ''; } };
let SIZE = 100, PAL = [], CD = 30, board, color = 3, sel = null, waitUntil = 0, ws, scale = 6, ox = 0, oy = 0;
const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('wrap'), view = $('view'), gcv = $('grid'), gctx = gcv.getContext('2d');
const DEMO = ['#ff3d7f', '#ffd23f', '#5ef2ff', '#8b5cff', '#3dff8e', '#ff7a59'];

// украшения: значок в логотипе и пиксель-арт в приветствии
$('logoIc').innerHTML = [0, 1, 2, 3, 4, 5, 2, 0, 1].map(i => `<i style="background:${DEMO[i]}"></i>`).join('');
const HEART = ['011000110', '111101111', '111111111', '111111111', '011111110', '001111100', '000111000', '000010000'];
$('art').innerHTML = Array.from({ length: 96 }, (_, i) => { const r = Math.floor(i / 12), c = i % 12 - 1.5, on = HEART[r] && HEART[r][Math.round(c)] === '1';
  return `<i style="background:${on ? DEMO[(r + Math.round(c)) % 2 ? 0 : 5] : 'rgba(255,255,255,' + (0.04 + ((i * 7) % 5) * .012) + ')'};animation-delay:${(r * 12 + i % 12) * 8}ms"></i>`; }).join('');

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400); }
function apply() { wrap.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`; drawGrid(); }
function drawGrid() { const d = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (gcv.width !== w * d || gcv.height !== h * d) { gcv.width = w * d; gcv.height = h * d; gcv.style.width = w + 'px'; gcv.style.height = h + 'px'; }
  gctx.setTransform(d, 0, 0, d, 0, 0); gctx.clearRect(0, 0, w, h); if (scale < 6) return;
  const a = Math.min(.22, (scale - 6) / 40 + .06); gctx.strokeStyle = `rgba(20,16,60,${a})`; gctx.lineWidth = 1; gctx.beginPath();
  const x0 = Math.max(0, Math.floor(-ox / scale)), x1 = Math.min(SIZE, Math.ceil((w - ox) / scale)), y0 = Math.max(0, Math.floor(-oy / scale)), y1 = Math.min(SIZE, Math.ceil((h - oy) / scale));
  for (let x = x0; x <= x1; x++) { const px = Math.round(ox + x * scale) + .5; gctx.moveTo(px, oy + y0 * scale); gctx.lineTo(px, oy + y1 * scale); }
  for (let y = y0; y <= y1; y++) { const py = Math.round(oy + y * scale) + .5; gctx.moveTo(ox + x0 * scale, py); gctx.lineTo(ox + x1 * scale, py); }
  gctx.stroke(); }
const barH = () => document.querySelector('.bar').offsetHeight + 20;
function fit() { const w = innerWidth, top = 64, h = innerHeight - barH() - top;
  scale = Math.max(1, Math.min(w * .92, h * .94) / SIZE); ox = (w - SIZE * scale) / 2; oy = top + (h - SIZE * scale) / 2; apply(); }
function draw(x, y, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, 1, 1); }
function drawAll() { const img = ctx.createImageData(SIZE, SIZE);
  const rgb = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  for (let i = 0; i < board.length; i++) { const p = rgb[board[i]] || rgb[0]; img.data.set([p[0], p[1], p[2], 255], i * 4); }
  ctx.putImageData(img, 0, 0); }
async function loadBoard() { board = new Uint8Array(await (await fetch(BASE + '/board', { cache: 'no-store' })).arrayBuffer()); drawAll(); }
function ping(x, y) { const p = document.createElement('div'); p.className = 'ping'; p.style.left = x + 'px'; p.style.top = y + 'px'; wrap.appendChild(p); setTimeout(() => p.remove(), 700); }

function buildPalette() { const el = $('pal'); el.innerHTML = '';
  PAL.forEach((c, i) => { const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.className = i === color ? 'on' : ''; b.setAttribute('aria-label', 'цвет ' + c);
    b.onclick = () => { color = i; [...el.children].forEach((x, j) => x.className = j === i ? 'on' : ''); $('sel').firstChild.style.background = c; tick(); }; el.appendChild(b); }); }

function setSel(x, y) { sel = { x, y }; const s = $('sel'); s.style.display = 'block'; s.style.transform = `translate(${x}px,${y}px)`; s.firstChild.style.background = PAL[color];
  $('coord').innerHTML = `<b>${x} · ${y}</b><span>свободная клетка</span>`; tick();
  fetch(`${BASE}/who?x=${x}&y=${y}`).then(r => r.json()).then(j => { if (sel && sel.x === x && sel.y === y) $('coord').innerHTML = `<b>${x} · ${y}</b><span>${j.name ? '🎨 ' + j.name.replace(/[<>&]/g, '') : 'свободная клетка'}</span>`; }).catch(() => {}); }

function tick() { const left = (waitUntil - Date.now()) / 1000, b = $('put'), L = $('putL'), F = $('fill');
  if (left > 0) { b.disabled = true; L.textContent = `⏳ ЕЩЁ ${Math.ceil(left)} С`; F.style.width = (100 - left / CD * 100) + '%'; return; }
  F.style.width = '0';
  if (!sel) { b.disabled = true; L.textContent = 'ВЫБЕРИ КЛЕТКУ'; }
  else if (!online()) { b.disabled = true; L.textContent = 'ПОДКЛЮЧАЮСЬ…'; }
  else { b.disabled = false; L.innerHTML = `<span class="sw" style="background:${PAL[color]}"></span>ПОСТАВИТЬ ПИКСЕЛЬ`; } }
setInterval(tick, 250);

$('put').onclick = () => { if (!sel || !online()) return;
  if (POLL) act({ t: 'place', x: sel.x, y: sel.y, c: color }).then(j => { waitUntil = Date.now() + (j.wait || 0) * 1000; if (!j.ok && j.wait) toast('Подожди ещё ' + Math.ceil(j.wait) + ' с'); tick(); }).catch(() => toast('Нет связи — попробуй ещё раз'));
  else ws.send(JSON.stringify({ t: 'place', x: sel.x, y: sel.y, c: color }));
  waitUntil = Date.now() + CD * 1000;
  board[sel.y * SIZE + sel.x] = color; draw(sel.x, sel.y, color); ping(sel.x, sel.y); try { tg && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} tick(); };

let POLL = false, pseq = 0, pollT = 0;
const helloData = () => ({ initData: tg ? tg.initData : '', anon: anonId(), name: myName() });
const act = d => fetch(BASE + '/act', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ ...helloData(), ...d }) }).then(r => r.json());
const online = () => POLL || (ws && ws.readyState === 1);
async function startPoll() { if (POLL) return; POLL = true; try { ws && ws.close(); } catch (e) {}
  const me = await act({ t: 'hello' }).catch(() => null); if (me) { $('meName').textContent = me.name; waitUntil = Date.now() + me.wait * 1000; }
  const info = await fetch(BASE + '/info', { cache: 'no-store' }).then(r => r.json()).catch(() => null); if (info) pseq = info.seq || 0;
  await loadBoard(); pollLoop(); }
async function pollLoop() { clearTimeout(pollT);
  try { const j = await (await fetch(`${BASE}/poll?since=${pseq}&id=${encodeURIComponent(anonId())}`, { cache: 'no-store' })).json();
    if (j.reload) { pseq = j.seq; await loadBoard(); } else { for (const q of j.px || []) { board[q.y * SIZE + q.x] = q.c; draw(q.x, q.y, q.c); } pseq = j.seq; }
    $('online').textContent = j.online; fails = 0;
  } catch (e) { if (++fails % 3 === 0) await resolveBase(); }
  tick(); pollT = setTimeout(pollLoop, 2000); }
function anonId() { try { let a = localStorage.getItem('pxAnon'); if (!a) { a = crypto.getRandomValues(new Uint32Array(4)).join('-'); localStorage.setItem('pxAnon', a); } return a; } catch (e) { return ''; } }
function connect() { if (POLL) return;
  ws = new WebSocket(BASE.replace(/^http/, 'ws') + '/ws'); const w0 = ws;
  setTimeout(() => { if (w0.readyState !== 1 && !POLL) startPoll(); }, 6000);
  ws.onopen = () => { fails = 0; ws.send(JSON.stringify({ t: 'hello', ...helloData() })); loadBoard(); tick(); };
  ws.onmessage = e => { const d = JSON.parse(e.data);
    if (d.t === 'px') { board[d.y * SIZE + d.x] = d.c; draw(d.x, d.y, d.c); }
    else if (d.t === 'online') $('online').textContent = d.n;
    else if (d.t === 'me' && d.name) { $('meName').textContent = d.name; waitUntil = Date.now() + d.wait * 1000; tick(); }
    else if (d.t === 'me' || d.t === 'wait') { waitUntil = Date.now() + d.wait * 1000; if (d.t === 'wait' && d.wait < CD) toast('Подожди ещё ' + Math.ceil(d.wait) + ' с'); tick(); }
    else if (d.t === 'reload') loadBoard(); };
  ws.onerror = () => { if (!POLL && w0.readyState !== 1) startPoll(); };
  ws.onclose = async () => { if (POLL) return; tick(); if (++fails % 3 === 0) await resolveBase(); setTimeout(connect, 2000); };
}

// --- перемещение и масштаб (мышь + пальцы) ---
const pts = new Map(); let moved = 0, pinch0 = null;
view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; $('topList').style.display = 'none';
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: scale, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, ox, oy }; } });
view.addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy); ox += dx; oy += dy; apply(); }
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const k = Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d; moved = 99;
    zoomAt(pinch0.mx, pinch0.my, Math.min(60, Math.max(1, pinch0.s * k)), pinch0); } });
function endPtr(e) { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null;
  if (e.type === 'pointerup' && pts.size === 0 && moved < 8) { const x = Math.floor((e.clientX - ox) / scale), y = Math.floor((e.clientY - oy) / scale);
    if (x >= 0 && y >= 0 && x < SIZE && y < SIZE) { setSel(x, y); if (scale < 7) smoothZoom(e.clientX, e.clientY, 8); } } }
view.addEventListener('pointerup', endPtr); view.addEventListener('pointercancel', endPtr);
view.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.min(60, Math.max(1, scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)))); }, { passive: false });
function zoomAt(mx, my, ns, from) { const s0 = from ? from.s : scale, ox0 = from ? from.ox : ox, oy0 = from ? from.oy : oy;
  const wx = (mx - ox0) / s0, wy = (my - oy0) / s0; scale = ns; ox = mx - wx * ns; oy = my - wy * ns; apply(); }
function smoothZoom(mx, my, target) { const s0 = scale, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 260), e = 1 - Math.pow(1 - k, 3); zoomAt(mx, my, s0 + (target - s0) * e); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
const center = () => [innerWidth / 2, (innerHeight - barH()) / 2 + 32];
$('zIn').onclick = () => smoothZoom(...center(), Math.min(60, scale * 1.6));
$('zOut').onclick = () => smoothZoom(...center(), Math.max(1, scale / 1.6));
$('zFit').onclick = fit;

const MED = ['🥇', '🥈', '🥉'];
$('topBtn').onclick = async () => { const el = $('topList'); if (el.style.display === 'block') { el.style.display = 'none'; return; }
  el.innerHTML = '<h3 class="brand">🏆 ТОП ХУДОЖНИКОВ</h3><div class="r">загружаю…</div>'; el.style.display = 'block';
  const t = await fetch(BASE + '/top').then(r => r.json()).catch(() => []);
  el.innerHTML = '<h3 class="brand">🏆 ТОП ХУДОЖНИКОВ</h3>' + (t.length ? t.map((r, i) => `<div class="r"><span class="m">${MED[i] || i + 1}</span><b>${r.name.replace(/[<>&]/g, '')}</b><span>${r.n}</span></div>`).join('') : '<div class="r">пока пусто — будь первым</div>'); };

const inTG = () => !!(tg && tg.initData);
if (inTG()) $('nameIn').style.display = 'none'; else $('nameIn').value = myName();
$('go').onclick = () => { const n = $('nameIn').value.trim(); if (!inTG() && n.length < 2) { $('nameIn').focus(); $('nameIn').placeholder = 'Напиши ник — от 2 букв'; return; }
  $('help').style.display = 'none'; try { localStorage.setItem('pxHelp', 1); if (n) localStorage.setItem('pxName', n); } catch (e) {}
  if (POLL) act({ t: 'hello' }).then(me => $('meName').textContent = me.name).catch(() => {});
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'hello', ...helloData() })); };
$('nameIn').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('meChip').onclick = () => { if (!inTG()) { $('help').style.display = 'flex'; $('nameIn').focus(); } };
try { if (localStorage.getItem('pxHelp') && (myName() || inTG())) $('help').style.display = 'none'; } catch (e) {}

(async () => { await resolveBase(); let info;
  for (;;) { try { info = await (await fetch(BASE + '/info', { cache: 'no-store' })).json(); break; } catch (e) { toast('Сервер просыпается… пробую ещё'); await new Promise(r => setTimeout(r, 4000)); await resolveBase(); } }
  SIZE = info.size; PAL = info.palette; CD = info.cooldown; $('cdTxt').textContent = CD;
  cv.width = cv.height = SIZE; cv.style.width = cv.style.height = SIZE + 'px'; buildPalette(); fit(); await loadBoard(); connect(); })();
addEventListener('resize', fit);
</script>
</body>
